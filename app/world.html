};
const FRONTIER = new Set(["AR","VN"]);  // standalone / frontier markets in index-provider terms
const REGIONS=["Americas","Europe","Asia-Pacific","Middle East & Africa"];
const MACRO_HINT = {
  "DX-Y.NYB":"The dollar against the euro, yen, pound and others; watch the direction. A rising dollar shrinks gains made abroad for dollar investors and hurts emerging markets that borrowed in dollars.",
  "^VIX":"How big a swing investors expect in US shares over the next month. 18 or less = low (the rule for 'investors confident'), 25 or more = stressed. Stress hits emerging markets hardest.",
  "^TNX":"What the US government pays to borrow for 10 years. When it rises, money tends to flow back to the US and borrowing gets dearer worldwide.",
  "CL=F":"Helps markets full of oil companies (Norway, Saudi Arabia, Canada, Brazil); a cost for big importers (India, Japan, Korea, Turkey). Usually quoted per barrel (159 litres); shown here per litre.",
  "HG=F":"Copper goes into almost everything that gets built, so it is a rough gauge of industrial demand. Matters most for mining-heavy markets (Chile, Australia, South Africa). Shown per tonne (1,000 kg), the way the London Metal Exchange quotes it; US futures quote it per pound (0.45 kg).",
  "GC=F":"Bought as a safe haven in worrying times; supports gold-mining companies in South Africa and Australia. Usually quoted per troy ounce (31.1 grams); shown here per gram.",
};
const METRICS = {
  score:{label:"Score (0–100)",get:r=>r.m.score,center:50,cap:50,fmt:v=>v.toFixed(0),tip:v=>`score ${v.toFixed(0)} of 100`},
  d1w:{label:"Score change this week",get:r=>r.m.d1w,center:0,cap:12,fmt:v=>sgn(v),tip:v=>`score ${v>=0?"up":"down"} ${Math.abs(Math.round(v))} this week`},
  today:{label:"Latest session (main index, own currency)",get:r=>r.local.r1d,center:0,cap:.02,fmt:v=>pct(v,1),tip:v=>`${pct(v,2)} in the latest session`},
  r1m:{label:"1 month (in US dollars)",get:r=>r.m.r1m,center:0,cap:.08,fmt:v=>pct(v,1),tip:v=>`${pct(v,1)} over 1 month in US dollars`},
  ytd:{label:"Since 1 January (in US dollars)",get:r=>r.m.ytd,center:0,cap:.3,fmt:v=>pct(v,0),tip:v=>`${pct(v,1)} since 1 January in US dollars`},
  r1y:{label:"1 year (in US dollars)",get:r=>r.m.r1y,center:0,cap:.4,fmt:v=>pct(v,0),tip:v=>`${pct(v,1)} over 1 year in US dollars`},
  ytdGbp:{label:"Since 1 January (in pounds)",get:r=>(r.gbp||{}).ytd,center:0,cap:.3,fmt:v=>pct(v,0),tip:v=>`${pct(v,1)} since 1 January in pounds`},
  r1yGbp:{label:"1 year (in pounds)",get:r=>(r.gbp||{}).r1y,center:0,cap:.4,fmt:v=>pct(v,0),tip:v=>`${pct(v,1)} over 1 year in pounds`},
  fx:{label:"Currency vs US dollar, 1 year",get:r=>r.fx?r.fx.y1:null,center:0,cap:.1,fmt:v=>pct(v,1),tip:v=>`currency ${v>=0?"up":"down"} ${pct(Math.abs(v),1,false)} vs the dollar`},
  value:{label:"Value score (higher = cheaper)",get:r=>r.m.value,center:50,cap:50,fmt:v=>v.toFixed(0),tip:v=>`value score ${v.toFixed(0)} of 100`},
  pe:{label:"Cheap or pricey vs world (P/E)",get:r=>r.m.peRel==null?null:-r.m.peRel,center:0,cap:.5,fmt:v=>`${pct(Math.abs(v),0,false)} ${v<0?"pricier":"cheaper"}`,tip:v=>`${pct(Math.abs(v),0,false)} ${v<0?"pricier":"cheaper"} than world stocks (P/E)`},
};
const RET = [{k:"r1m",l:"1 mo",cap:.08,tip:"Return over the last month"},{k:"r3m",l:"3 mo",cap:.15,tip:"Return over the last 3 months"},
  {k:"ytd",l:"Since Jan 1",cap:.3,tip:"Return since 1 January"},{k:"r1y",l:"1 yr",cap:.4,tip:"Return over the last year"},
  {k:"r3y",l:"3 yr avg",cap:.2,tip:"Average yearly return over the last 3 years"}];
const WORLD = "world stocks (MSCI ACWI)";

/* ---------------------------------------------------------------- state */
const store = makeStore("wc.");
const S = {data:null, filter:store.get("filter","all"), q:"", sort:store.get("sort",{k:"score",dir:-1}), basis:store.get("basis","usd"),
           metric:store.get("metric","score"), rrg:store.get("rrg","all"), sel:null, range:"1y", pcur:store.get("pcur","gbp"),
           cols:store.get("cols","key"), dtab:"summary"};
// return figures in the chosen view: what a US-dollar investor got, the same in pounds, or the local index in its own currency
const retSrc = r => S.basis==="local" ? r.local : S.basis==="gbp" ? (r.gbp||{}) : r.m;
const inv = () => S.basis==="gbp" ? {src:"gbp",word:"in pounds",sign:"£"} : {src:"usd",word:"in US dollars",sign:"$"};
let TOPO=null;
const isOpen = r => { const p=r.status&&r.status.period, now=Date.now()/1000; return !!(p&&p.start&&p.end&&p.start<=now&&now<p.end); };
const rows = () => S.data.rows;
const byCode = c => rows().find(r=>r.code===c);
const avgOf = (list,get) => { const v=list.map(get).filter(x=>x!=null); return v.length? v.reduce((a,x)=>a+x,0)/v.length : null; };
function mixColor(v,center,cap){ if(v==null) return "var(--surface2)";
  const t=Math.max(-1,Math.min(1,(v-center)/cap)); return `color-mix(in oklab,var(${t>=0?"--pos":"--neg"}) ${Math.round(12+Math.abs(t)*68)}%,var(--surface2))`; }
const marketType = r => r.dm? "Developed market" : FRONTIER.has(r.code)? "Frontier market" : "Emerging market";
const TYPE_TIP = {"Developed market":"A wealthy country with a long-established stock market.",
  "Emerging market":"A less-developed economy whose stock market is usually bumpier and riskier.",
  "Frontier market":"A smaller, less-developed market than emerging markets, with extra risks such as capital controls."};
function traitChips(r){ const type=marketType(r);
  return r.traits.filter(t=>t!=="em").map(t=>`<span class="chip">${esc(S.data.traits[t]||t)}</span>`).join("")+`<span class="chip" title="${esc(TYPE_TIP[type])}">${type}</span>`; }
const fitText = f => f>0? `${f} more helping than hurting` : f<0? `${-f} more hurting than helping` : "helping and hurting balance out";

/* ---------------------------------------------------------------- narrative */
function narrative(r){
  const m=r.m, l=r.local, fx=r.fx, cn=ccyName(r.index.ccy), cp=ccyPlural(r.index.ccy), out=[];
  const I=inv(), fy=I.src==="gbp"?(r.gbp||{}).r1y:m.r1y, wy=I.src==="gbp"?((S.data.world.gbp||{}).r1y):(m.r1y!=null&&m.rs1y!=null?m.r1y-m.rs1y:null);
  if(fy!=null){
    let s=`${I.word[0].toUpperCase()+I.word.slice(1)}, ${r.name}'s fund is ${upDown(fy,1)} over the past year.`;
    if(wy!=null){ const shown=(+(fy*100).toFixed(1) - +(wy*100).toFixed(1))/100;
      s+=` All world stocks (MSCI ACWI) ${wy>=0?"rose":"fell"} ${pct(Math.abs(wy),1,false)}, so ${r.name} is ${aheadBehind(shown)}. ${I.sign}1,000 put in a year ago would now be about ${I.sign}${Math.round(1000*(1+fy)).toLocaleString()}, against ${I.sign}${Math.round(1000*(1+wy)).toLocaleString()} in world stocks.`; }
    out.push(s);
  }
  if(l.r1y!=null) out.push(`In ${cp}, the ${r.index.name} is ${upDown(l.r1y,1)} over the year`+(fx&&fx.y1!=null?`, while the ${cn} ${fx.y1>=0?"gained":"lost"} ${pct(Math.abs(fx.y1),1,false)} against the US dollar. ${Math.abs(fx.y1)>=0.03?(fx.y1>0?"The stronger currency added to returns for dollar investors.":"The weaker currency ate into returns for dollar investors."):"The currency made little difference."}`:"."));
  if(l.r1y!=null&&m.r1y!=null&&fx&&fx.y1!=null&&!r.index.proxy){
    // the dollar fund's return converted into local currency, to separate currency effects from differences in holdings
    const localFund=(1+m.r1y)/(1+fx.y1)-1;
    if(Math.abs(l.r1y-localFund)>0.05) out.push(`Index vs fund: converted into ${cp}, the ${r.etf} fund ${localFund>=0?"rose":"fell"} ${pct(Math.abs(localFund),1,false)}, while the ${r.index.name} ${l.r1y>=0?"rose":"fell"} ${pct(Math.abs(l.r1y),1,false)}. That gap of about ${pct(Math.abs(l.r1y-localFund),0,false)} comes from the two holding a different mix of companies (and most headline indexes leave out dividends), not from the currency.`);
  }
  out.push(m.trend===4?"Clear uptrend in dollar terms: the price is above its average over the last 50 trading days (about 2½ months) and 200 trading days (about 10 months), and the 200-day average is rising."
    : m.trend===0?"Clear downtrend in dollar terms: the price is below both its 50-day and 200-day averages, and the 200-day average is falling."
    : m.vs200>0?`Mixed trend in dollar terms: it passes ${m.trend} of 4 uptrend checks, and is still above its 200-day (about 10-month) average price.`
    : `Mixed trend in dollar terms: it passes ${m.trend} of 4 uptrend checks, and is below its 200-day (about 10-month) average price.`);
  const qs=quadSentence(m.quad,"all world stocks"); if(qs) out.push(`Rotation (${m.quad}): ${qs}`);
  const ht=historyText(m,false); if(ht) out.push("Score changes (out of 100): "+ht);
  const wpe=(S.data.world.facts||{}).pe;
  if(m.pe!=null&&wpe) out.push(`Valuation: investors pay ${m.pe.toFixed(1)} times the last year's company profits here (P/E), against ${wpe.toFixed(1)} for world stocks, so ${r.name} is ${Math.abs(m.peRel)<0.05?"about the same":`${pct(Math.abs(m.peRel),0,false)} ${m.peRel>0?"pricier":"cheaper"}`}. Value score ${m.value==null?"–":Math.round(m.value)} of 100 (higher = cheaper P/E and a higher dividend yield than the other countries). `+
    (m.peRel<-0.25?"Cheap markets are often cheap for a reason (the kinds of companies, how they're run, politics), but low expectations can cushion bad news.":m.peRel>0.2?"A higher price usually needs strong profit growth to hold up.":""));
  const plain=n=>n.toLowerCase();
  if(m.tail.length||m.head.length) out.push(`Today's conditions: ${m.tail.length?"helped by "+m.tail.map(plain).join(" and "):""}${m.tail.length&&m.head.length?"; ":""}${m.head.length?"held back by "+m.head.map(plain).join(" and "):""}. These are rules of thumb about what tends to affect markets like this one.`);
  if(m.corr!=null) out.push(`Diversification: over the past year, its weekly ups and downs moved ${m.corr<0.5?"quite differently from":m.corr>0.85?"almost in step with":"fairly closely with"} world stocks (correlation ${m.corr.toFixed(2)}: 1 = in step, 0 = unrelated, below 0 = opposite). ${m.corr<0.5?"That helps spread risk in a global portfolio.":m.corr>0.85?"So it adds little variety to a global portfolio.":"So it adds some variety to a global portfolio."}`);
  if(m.vol!=null) out.push(`Risk: over the last 3 months, in dollars, its volatility (a measure of typical daily ups and downs, scaled to a year) was ${pct(m.vol,0,false)}. Its biggest drop from a high in the past year was ${pct(Math.abs(m.mdd),1,false)}.`);
  if(m.rsi!=null){ if(m.rsi>=70) out.push(`Timing: its recent gains have been much bigger than its recent losses (RSI ${m.rsi.toFixed(0)}; 70 or more counts as 'overbought'). Sharp rises like this can pause.`);
    else if(m.rsi<=30) out.push(`Timing: its recent losses have been much bigger than its recent gains (RSI ${m.rsi.toFixed(0)}; 30 or under counts as 'oversold'). Sharp drops like this can bounce, but can also keep going.`); }
  return out;
}
function reasonShort(r){
  const m=r.m, bits=[`${upDown(m.r1y,0)} in a year (US$)`,TREND_WORD[m.trend]];
  if(m.quad) bits.push(QUAD_PLAIN[m.quad]);
  if(m.peRel!=null) bits.push(Math.abs(m.peRel)<0.05?"priced like world stocks":`${pct(Math.abs(m.peRel),0,false)} ${m.peRel>0?"pricier":"cheaper"} than world stocks`);
  if(m.d1w!=null&&Math.abs(m.d1w)>=1) bits.push(`score ${m.d1w>0?"up":"down"} ${Math.round(Math.abs(m.d1w))} this week`);
  return bits.join(" · ");
}

/* ---------------------------------------------------------------- page */
const seg=(attr,cur,opts,label)=>`<span class="seg" role="group" aria-label="${label}">${opts.map(([v,l])=>`<button type="button" data-${attr}="${v}" aria-pressed="${cur===v}">${l}</button>`).join("")}</span>`;
const COLSETS=[["key","Key figures"],["returns","Returns"],["risk","Risk & value"],["all","Everything"]];
const nameOfCode = c => (byCode(c)||{}).name||c;

function render(){
  const D=S.data, app=$("#app"), open=rows().filter(isOpen), n=rows().length;
  if(!COLSETS.some(([k])=>k===S.cols)) S.cols="key";
  const movers=rows().filter(r=>r.local.r1d!=null).sort((a,b)=>b.local.r1d-a.local.r1d);
  const mover=r=>`<div class="idea" data-open="${r.code}" role="button" tabindex="0"><span class="nm">${esc(r.name)} <span class="muted" style="font-weight:400;font-size:12.5px">${esc(r.index.name)}</span></span><span class="sc ${cls(r.local.r1d)}">${pct(r.local.r1d,2)}</span></div>`;
  const active=D.rules.filter(x=>x.active), inactive=D.rules.filter(x=>!x.active);
  app.innerHTML = `
  <div class="view" data-view="overview">

function heroCards(open){

  const riser=rs.filter(r=>r.m.d1w!=null).sort((a,b)=>b.m.d1w-a.m.d1w)[0];
  return [
    stat({label:"World stocks, latest session",ico:"globe",value:pct(W.r1d,2),tone:cls(W.r1d),sub:`MSCI ACWI, in US dollars · past year ${pct(W.r1y,1)}`}),
    top&&stat({label:"Highest score",ico:"award",open:top.code,body:ringRow(top.m.score,top.name,`${esc(top.index.name)} · ${esc(top.m.signal)}`)}),
    riser&&riser.m.d1w>=1&&stat({label:"Biggest score rise this week",ico:"up",open:riser.code,body:ringRow(riser.m.score,riser.name,`up ${Math.round(riser.m.d1w)} this week · ${esc(riser.m.signal)}`)}),
    stat({label:`Signals across all ${n} markets`,ico:"bars",href:"#ranking",body:sigDist(rs.map(r=>r.m.signal))}),
    stat({label:"Trading right now",ico:"clock",href:"#worldmap",value:`${open.length} <span class="muted" style="font-size:16px;font-weight:500">of ${rows().length}</span>`,body:meter(open.length/rows().length,"var(--accent)"),
      sub:open.length?esc(open.slice(0,4).map(r=>r.name).join(", ")+(open.length>4?` and ${open.length-4} more`:"")):"All tracked markets are closed"}),
    stat({label:"Today's conditions",ico:"conditions",href:"#conditions",body:`<div class="pick-tags" style="margin:0">${active.map(x=>tag(esc(x.name),"info")).join("")||'<span class="muted">None active right now</span>'}</div>`,
      sub:"Which markets they tend to help or hurt"}),
  ];
}
function ruleCard(x){
  const hit=rows().filter(r=>x.tail.some(t=>r.traits.includes(t))), hurt=rows().filter(r=>x.head.some(t=>r.traits.includes(t)));
  const ctag=(r,tone)=>tag(esc(r.name),tone,`data-open="${r.code}" role="button" tabindex="0" title="Open ${esc(r.name)}"`);
  return `<div class="card rule${x.active?"":" off"}"><div class="rule-head"><b>${esc(x.name)}</b>${x.active?tag("Active now","info"):tag("No effect now")}</div>
    <p>${esc(x.note)}</p>
    ${x.active&&hit.length?`<div class="rule-row"><span class="rule-lab pos">${icon("up",13)}Tends to help</span><div class="pick-tags" style="margin:0">${hit.map(r=>ctag(r,"pos")).join("")}</div></div>`:""}
    ${x.active&&hurt.length?`<div class="rule-row"><span class="rule-lab neg">${icon("down",13)}Tends to hurt</span><div class="pick-tags" style="margin:0">${hurt.map(r=>ctag(r,"neg")).join("")}</div></div>`:""}</div>`;
}
const MACRO_ORDER=["DX-Y.NYB","^VIX","^TNX","CL=F","HG=F","GC=F"];
const REL_HINT={SMH:"Chip designers and makers compared with all world stocks. When they do better, it tends to lift tech-heavy markets (Taiwan, Korea, the Netherlands, the US, Israel).",
  EEM:"Less-developed markets such as China, Taiwan, India and Korea as a group, compared with all world stocks, which include them."};
function macroTiles(){
  const M=S.data.macro, DOLLAR=new Set(["CL=F","HG=F","GC=F"]);
  const before=(m,dp,u="")=>`prev close ${(m.price/(1+m.r1d)).toFixed(dp)}${u} · 3 mo ago ${(m.price/(1+m.r3m)).toFixed(dp)}${u}`;
  const tiles=MACRO_ORDER.map(sym=>{ const m=M[sym]; if(!m) return "";
    const val= sym==="^TNX"? m.price.toFixed(2)+"%" : sym==="CL=F"? "$"+m.price.toFixed(3) : (DOLLAR.has(sym)?"$":"")+money(m.price);
    const chg= sym==="^TNX"? `<span class="muted">${before(m,2,"%")}</span>` : sym==="^VIX"? `<span class="muted">${before(m,1)}</span>`
      : `<span class="${cls(m.r1d)}">Latest ${pct(m.r1d)}</span><span class="${cls(m.r3m)}">3 mo ${pct(m.r3m)}</span>`;
    return `<div class="tile" title="${esc(MACRO_HINT[sym]||"")}"><span class="lab">${esc(m.label)}</span><span class="val">${val}</span>
      <span class="chg">${chg}</span>${sparkSVG(m.spark,{w:200,h:30,color:sym==="^VIX"||sym==="^TNX"||sym==="DX-Y.NYB"?"var(--warn)":null})}</div>`; });
  const rel=(l,v,h)=>`<div class="tile" title="${esc(h)}"><span class="lab">${l}</span><span class="val ${cls(v)}">${aheadBehind(v)}</span><span class="chg"><span class="muted">${relPrep(v)}world stocks, past 3 months</span></span></div>`;
  return tiles.join("")+rel("Chip stocks (SMH fund)",M.SMH_REL,REL_HINT.SMH)+rel("Emerging markets (EEM fund)",M.EEM_REL,REL_HINT.EEM);
}
function macroHints(){ const M=S.data.macro;
  return `<ul>${MACRO_ORDER.map(sym=>M[sym]?`<li><b>${esc(M[sym].label)}</b>: ${esc(MACRO_HINT[sym]||"")}</li>`:"").join("")}
    <li><b>Chip stocks (SMH fund)</b>: ${esc(REL_HINT.SMH)}</li><li><b>Emerging markets (EEM fund)</b>: ${esc(REL_HINT.EEM)}</li></ul><p>Each small chart shows the last 6 months.</p>`; }

function pickRow(r,extra){
  const m=r.m, tags=extra?extra(r):[];
  if(!extra){
    if(m.rs1y!=null) tags.push(tag(esc(`${aheadBehind(m.rs1y,0)} ${relPrep(m.rs1y)}world stocks, 1 yr`),near0(m.rs1y)?"":m.rs1y>0?"pos":"neg"));
    if(m.trend!=null) tags.push(tag(esc(cap(TREND_WORD[m.trend])),m.trend>=3?"pos":m.trend<=1?"neg":""));
    if(m.quad) tags.push(tag(esc(m.quad),QUAD_TONE[m.quad],`title="${esc(cap(QUAD_PLAIN[m.quad]))}"`));
    if(m.value!=null&&m.value>=60) tags.push(tag(`Cheap · value ${Math.round(m.value)}`,"info"));
  }
  const c=m.series.c, sp=sparkSVG(c.filter((_,j)=>j%4===0||j===c.length-1),{w:64,h:28});
  return pickCard({key:r.code,name:r.name,sub:r.index.name,score:m.score,tags,spark:sp,title:reasonShort(r)});
}
function ideas(){
  const rs=rows().filter(r=>r.m.score!=null), wpe=(S.data.world.facts||{}).pe;
  const lead=rs.slice().sort((a,b)=>b.m.score-a.m.score).slice(0,5);
  const turn=rs.filter(r=>r.m.quad==="Improving"&&r.m.rrg&&r.m.rrg.length>1)
    .sort((a,b)=>(b.m.rrg.at(-1)[1]-b.m.rrg[0][1]+(b.m.d1m||0)/10)-(a.m.rrg.at(-1)[1]-a.m.rrg[0][1]+(a.m.d1m||0)/10)).slice(0,5);
  const value=rs.filter(r=>(r.m.value??0)>=60&&r.m.score>=45).sort((a,b)=>(b.m.value+b.m.score)-(a.m.value+a.m.score)).slice(0,5);
  const avoid=rs.slice().sort((a,b)=>a.m.score-b.m.score).slice(0,5);
  const cheapTags=r=>[tag(`Value ${Math.round(r.m.value)}/100`,"info"),
    tag(esc(`P/E ${r.m.pe==null?"–":r.m.pe.toFixed(1)}${wpe?` vs ${wpe.toFixed(1)}`:""}`),"",`title="Price vs profits; world stocks ${wpe?wpe.toFixed(1):"–"}"`),
    tag(esc(`Yield ${pct(r.m.yld,1,false)}`),"",`title="Dividends over the past year, as a % of the price"`), tag(esc(`${cap(upDown(r.m.r1y,0))} in a year`),cls(r.m.r1y))];
  const col=(title,ico,tone,desc,list,fx)=>`<div class="card pickcol"><h3><span class="pc-ico ${tone}">${icon(ico,16)}</span>${title}</h3><p>${desc}</p>${list.map(r=>pickRow(r,fx)).join("")||'<p class="muted">Nothing qualifies right now.</p>'}</div>`;
  return col("Highest scores","trend","pos","Best on performance against world stocks, trend and risk.",lead)+
    col("Cheap and holding up","coin","accent","Value score of 60+ and a score of at least 45.",value,cheapTags)+
    col("Turnaround watch","up","info","Behind world stocks lately, but improving.",turn)+
    col("Lowest scores","down","neg","Weakest on performance, trend and risk. Check whether cheapness or conditions offset it.",avoid);
}
function regionCard(g){
  const rs=rows().filter(r=>r.region===g); if(!rs.length) return "";
  const s=avgOf(rs,r=>r.m.score), y=avgOf(rs,r=>r.m.r1y), best=rs.slice().sort((a,b)=>b.m.score-a.m.score);

    <div class="stat-row">${ring(s,{size:56,stroke:6})}<div><div style="font-weight:600">Average score</div><div class="muted" style="font-size:12.5px">${rs.length} markets · ${rs.filter(isOpen).length} open now</div></div></div>
    <div>Average country, past year in US$: <b class="${cls(y)}">${pct(y,1)}</b></div>
    <div class="idea" data-open="${best[0].code}" role="button" tabindex="0" style="padding:6px 0"><span class="nm">Highest: ${esc(best[0].name)}</span><span class="sc">${sigPill(best[0].m.signal,Math.round(best[0].m.score))}</span></div>
    <div class="idea" data-open="${best.at(-1).code}" role="button" tabindex="0" style="padding:6px 0"><span class="nm">Lowest: ${esc(best.at(-1).name)}</span><span class="sc">${sigPill(best.at(-1).m.signal,Math.round(best.at(-1).m.score))}</span></div></div>`;
}

async function renderMap(){
  const el=$("#map"), M=METRICS[S.metric]; if(!el) return;
  if(!window.d3||!d3.geoNaturalEarth1||!window.topojson){ el.innerHTML='<p class="muted">The map library could not load. Check your connection; everything else still works.</p>'; return; }
  try{ if(!TOPO) TOPO=await (await fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json")).json(); }
  catch(e){ el.innerHTML='<p class="muted">The map outline could not load. Everything else still works.</p>'; return; }
  const W=Math.max(300,el.clientWidth||800), H=Math.round(W*0.48);
  const feats=topojson.feature(TOPO,TOPO.objects.countries).features.filter(f=>f.id!=="010");
  const proj=d3.geoNaturalEarth1().fitSize([W,H],{type:"FeatureCollection",features:feats}), path=d3.geoPath(proj);
  const byIso=Object.fromEntries(rows().map(r=>[r.iso,r])), drawn=new Set();
  const tipFor=r=>{ const v=M.get(r); return `${r.name}: ${v==null?(S.metric==="fx"&&r.code==="US"?"no currency conversion":"–"):M.tip(v)}`; };
  let s=feats.map(f=>{ const r=byIso[f.id]; if(r) drawn.add(r.iso);
    return `<path class="land ${r?"on":""}" d="${path(f)}" style="fill:${r?mixColor(M.get(r),M.center,M.cap):"var(--surface2)"}" ${r?`data-open="${r.code}" data-tip="${esc(tipFor(r))}"`:""}></path>`; }).join("");
  rows().filter(r=>!drawn.has(r.iso)).forEach(r=>{ const [x,y]=proj(r.ll);
    s+=`<circle class="land on" cx="${x}" cy="${y}" r="${Math.max(4,W/170)}" style="fill:${mixColor(M.get(r),M.center,M.cap)};stroke:var(--ink);stroke-width:.8" data-open="${r.code}" data-tip="${esc(tipFor(r))}"></circle>`; });
  rows().filter(isOpen).forEach(r=>{ const [x,y]=proj(r.ll); s+=`<circle cx="${x}" cy="${y-Math.max(6,W/120)}" r="2.6" fill="var(--pos)" pointer-events="none"></circle>`; });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="World map coloured by ${esc(M.label)}">${s}</svg>`;
  el.querySelectorAll("[data-tip]").forEach(n=>{ n.addEventListener("mousemove",e=>{ $("#tip").textContent=n.dataset.tip; showTip(e); }); n.addEventListener("mouseleave",()=>$("#tip").hidden=true); });
  const lo=M.center-M.cap, hi=M.center+M.cap, ends=S.metric==="score"||S.metric==="value";
  $("#legend").innerHTML=`<span class="muted">${esc(M.fmt(lo))}${ends?"":" or less"}</span><span class="legendbar" style="background:linear-gradient(90deg,${mixColor(lo,M.center,M.cap)},var(--surface2),${mixColor(hi,M.center,M.cap)})"></span><span class="muted">${esc(M.fmt(hi))}${ends?"":" or more"}</span>
    <span class="muted" style="margin-left:8px">${esc(M.label)} · <span class="open"></span> dot = trading now · grey = not tracked</span>`;
}
function renderVM(){
  const el=$("#vm"), rs=rows().filter(r=>r.m.peRel!=null&&r.m.score!=null); if(!el) return;
  const W=Math.max(300,el.clientWidth||520), H=Math.round(Math.min(W*0.8,480)), P=36;
  const ex=Math.max(.3,...rs.map(r=>Math.abs(r.m.peRel)))*1.1;
  const X=v=>P+(v+ex)/(2*ex)*(W-2*P), Y=v=>H-P-v/100*(H-2*P), cx=X(0), cy=Y(50);
  let s=`<rect x="${P}" y="${P}" width="${cx-P}" height="${cy-P}" fill="var(--pos)" fill-opacity=".07"/>
    <rect x="${cx}" y="${cy}" width="${W-P-cx}" height="${H-P-cy}" fill="var(--neg)" fill-opacity=".07"/>
    <line x1="${P}" x2="${W-P}" y1="${cy}" y2="${cy}" stroke="var(--line)"/><line x1="${cx}" x2="${cx}" y1="${P}" y2="${H-P}" stroke="var(--line)"/>
    <text x="${P+6}" y="${P+16}" font-size="12" font-weight="600" fill="var(--pos)">CHEAP AND STRONG</text>
    <text x="${W-P-6}" y="${P+16}" text-anchor="end" font-size="12" font-weight="600" fill="var(--warn)">PRICEY AND STRONG</text>
    <text x="${P+6}" y="${H-P-8}" font-size="12" font-weight="600" fill="var(--info)">CHEAP BUT WEAK</text>
    <text x="${W-P-6}" y="${H-P-8}" text-anchor="end" font-size="12" font-weight="600" fill="var(--neg)">PRICEY AND WEAK</text>
    <text x="${W/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">← cheaper   P/E compared with world stocks   pricier →</text>
    <text x="12" y="${H/2}" text-anchor="middle" font-size="11" fill="var(--muted)" transform="rotate(-90 12 ${H/2})">Higher score →</text>`;
  const placed=[];
  rs.slice().sort((a,b)=>b.m.score-a.m.score).forEach(r=>{ const x=X(r.m.peRel), y=Y(r.m.score);
    const t=`${r.name}: ${pct(Math.abs(r.m.peRel),0,false)} ${r.m.peRel>0?"pricier":"cheaper"} than world stocks (P/E), score ${Math.round(r.m.score)} of 100`;
    s+=`<circle cx="${x}" cy="${y}" r="5" fill="${scoreColor(r.m.score)}" stroke="var(--surface)" stroke-width="1.5" data-open="${r.code}" style="cursor:pointer"><title>${esc(t)}</title></circle>`;
    // nudge labels apart so neighbouring countries stay readable
    let ly=y+4; while(placed.some(p=>Math.abs(p.y-ly)<11&&Math.abs(p.x-x)<24)) ly+=11; placed.push({x,y:ly});
    s+=`<text x="${x+7}" y="${ly}" font-size="11" fill="var(--ink)" data-open="${r.code}" style="cursor:pointer"><title>${esc(t)}</title>${r.code}</text>`; });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cheapness versus score">${s}</svg>`;
}

/* ---------------------------------------------------------------- rankings */
function val(r,k){
  const src=retSrc(r);
  if(k==="name") return r.name; if(k==="today") return r.local.r1d; if(k==="fx") return r.fx?r.fx.y1:null;
  if(k==="quad") return ["Lagging","Improving","Weakening","Leading"].indexOf(r.m.quad);
  if(RET.some(c=>c.k===k)) return src[k];
  return r.m[k];
}

function renderTable(){
  const q=S.q.trim().toLowerCase(), code={key:"k",returns:"r",risk:"v"}[S.cols];
  const list=rows().filter(r=>(S.filter==="all"||(S.filter==="dm"&&r.dm)||(S.filter==="em"&&!r.dm)||r.region===S.filter) &&
      (!q||(r.name+" "+r.code+" "+r.index.name+" "+r.etf+" "+r.region).toLowerCase().includes(q)||holdingMatch(r)))
    .sort((a,b)=>{ const x=val(a,S.sort.k), y=val(b,S.sort.k); if(x==null) return 1; if(y==null) return -1;
      return (typeof x==="string"?x.localeCompare(y):x-y)*S.sort.dir; });
  const cols=tableCols().filter(c=>!code||c.s.includes(code));
  $("#tablebox").innerHTML = list.length? `<table><thead><tr>${cols.map(c=>c.th()).join("")}</tr></thead>
    <tbody>${list.map((r,i)=>`<tr data-open="${r.code}">${cols.map(c=>c.td(r,i)).join("")}</tr>`).join("")}</tbody></table>`
    : `<p class="loading">No markets match “${esc(S.q)}”.</p>`;
  $("#tablebox").querySelectorAll("th[data-k]").forEach(h=>h.onclick=()=>{const k=h.dataset.k;
    S.sort = S.sort.k===k? {k,dir:-S.sort.dir} : {k,dir:k==="name"?1:-1}; store.set("sort",S.sort); renderTable();});
}
function holdingMatch(r){
  const q=S.q.trim().toLowerCase(); if(q.length<2||!r.holdings) return null;
  return r.holdings.find(x=>x.name.toLowerCase().includes(q)||x.sym.toLowerCase()===q) || null;
}
function glossary(n){ return `<div class="glossary">
  <div><b>Score (0–100)</b> ranks each market against all ${n} on performance against world stocks (3, 6 and 12 months), trend and risk. 50 = middle; 60+ = favoured; under 40 = weak.</div>
  <div><b>Latest session</b> the main index's move in its latest trading session, in its own currency. <span class="open"></span> = trading now.</div>
  <div><b>Returns in</b> the return columns show what a US-dollar investor got in a US-listed fund for that country (dividends included), the same converted into pounds, or the country's main index in its own currency. The other columns stay in US dollars.</div>
  <div><b>vs world, 6 mo</b> how far ahead (+) or behind (−) world stocks (MSCI ACWI) over 6 months, in US dollars.</div>
  <div><b>Currency, 1 yr</b> the country's currency against the US dollar. + = got stronger, which adds to returns for dollar investors.</div>

  <div><b>Value (0–100)</b> higher = cheaper P/E and a higher dividend yield than the other countries.</div>
  <div><b>Moves with world</b> correlation: 1 = weekly ups and downs in step with world stocks, 0 = unrelated. Lower = better for spreading risk.</div>
  <div><b>Conditions</b> how many of today's rules help this market minus how many hurt it (see the Conditions tab).</div>
  <div><b>Rotation</b> vs world stocks over roughly the last two months: Leading = ahead and pulling away · Weakening = ahead but its edge is fading · Lagging = behind and slipping · Improving = behind but improving.</div></div>`; }

/* ---------------------------------------------------------------- guide */
function guide(n){
  const D=S.data, bt=D.backtest;
  return `<section>${secHead({eyebrow:"Guide",title:"How to read and use this page",lead:"Open any topic below."})}
    <div class="acc">
      ${fold("g-read","How to read this page",`<p>Each country is compared with <b>all world stocks</b> (the MSCI ACWI index: thousands of large and mid-sized companies across developed and emerging markets, more than half of them American), in <b>US dollars</b>. "Ahead" means the country's fund did better than simply owning world stocks; "behind" means it did worse.</p>
        <p>Each country gets a <b>score from 0 to 100</b> that ranks it against the other ${n-1}, based on its performance against world stocks, its price trend and its risk. When tested on the past, the score did not reliably pick winning countries, so weigh it alongside valuation, currency and today's conditions, which are all shown here.</p>
        <p>The tabs at the top split the page up: <b>Overview</b> for today's picture and the map, <b>Rankings</b> for every market, <b>Maps</b> for cheapness, rotation and regions, <b>Conditions</b> for what today's dollar, oil, metals and mood tend to favour, and <b>Track record</b> for how the score has done. Click any country, anywhere, for its full breakdown.</p>`,true)}
      ${fold("g-measured","What is measured",`<p>Each country is tracked two ways: its main stock index in its own currency (what local investors see), and a US-listed fund holding that country's shares, in US dollars with dividends included (what a US-dollar investor actually gets).</p>
        <p>The score uses the same six measures as the Sectors page, on the dollar fund, ranked across all ${n} markets:</p>
        <ul>${Object.entries(D.weights).map(([k,w])=>`<li title="${esc(partTip(k,"world stocks"))}">${esc(partName(k,"world stocks"))}: <b>${Math.round(w*100)}%</b></li>`).join("")}</ul>`)}
      ${fold("g-reading","Reading it",`<ul>
        <li><b>Score</b> (0–100) reflects performance against world stocks, trend and risk. ${!bt?"":btStrength(bt).cls==="good"?"Tested on the past, high-scoring countries did better on average.":"Tested on the past, high-scoring countries did not reliably do better than low-scoring ones, so don't use it alone to pick winners."}</li>
        <li><b>Value score</b> (0–100) ranks how cheap a market is: 60% P/E, 40% dividend yield. Cheap markets can stay cheap, but start from lower expectations.</li>
        <li><b>Currency</b> can add or remove several percent a year for foreign investors. Compare the local and dollar views.</li>
        <li><b>Today's conditions</b> show which kinds of market today's dollar, oil, metals, investor mood and chip stocks tend to help.</li>
        <li><b>Moves with world</b> below 0.5 means a market has behaved quite differently from world stocks, which helps spread risk.</li></ul>`)}
      ${fold("g-cols","What the table columns mean",glossary(n))}
      ${fold("g-updates","What updates, and when",`<p><b>With every price update</b> (${STATIC?"about every 15–30 minutes":"every 5 minutes"}): index levels, currencies, fund prices, returns, scores, score changes, open/closed status, today's conditions, the map and every written verdict.</p>
        <p><b>Every weekday after the US close:</b> a snapshot of every score is saved, which feeds "What changed recently". <b>At the start of each month:</b> the practice portfolios are re-picked, and the test on past data adds the month just finished.</p>
        <p><b>Once a day:</b> P/E, dividend yield, fees and top holdings.</p>
        <p class="muted" style="font-size:12.5px">${n} markets${D.errors.length?` · unavailable: ${esc(D.errors.join(", "))}`:""}</p>`)}
    </div></section>
  <section id="limits">${secHead({eyebrow:"Read before relying on it",title:"Limitations",lead:"A tool for spotting and keeping an eye on markets, not a forecast. Investing in one country adds currency risk, political risk and the risk that it's hard to buy or sell quickly at a fair price."})}
    <div class="acc">
      ${fold("l-data","The data",`<ul>
        <li>Prices come from Yahoo Finance's free, unofficial feed. They can be about 15 minutes late and can have gaps or errors. Short glitches that snap back are filtered out.</li>
        <li>Yahoo has no usable index history for Chile, Poland, Thailand, the Philippines, Vietnam or Saudi Arabia, so their "local index" is the US fund converted back into local currency. Egypt is not covered.</li>
        <li>Most indexes count only price changes, but the DAX, Ibovespa, NZX 50 and Oslo benchmark also add back dividends, so their local returns look higher.</li>
        <li>The main index and the US fund don't hold identical companies. Hong Kong, China, Japan and Argentina differ the most (see each country's notes).</li>
        <li>Open/closed status uses each exchange's normal trading hours and ignores lunch breaks and holidays that Yahoo doesn't report.</li></ul>`)}
      ${fold("l-analysis","The analysis",`<ul>
        <li>${!bt?"The score has not been tested on past data yet.":btStrength(bt).cls==="good"?"Tested on the past, high-scoring countries did better on average.":"Tested on the past ~9 years, high-scoring countries did not reliably do better than low-scoring ones."} See <a href="#track">the full test</a>.</li>
        <li>Valuation uses each fund's P/E based on the past 12 months' profits. Markets full of banks and miners naturally have lower P/Es than tech-heavy ones, so cheap isn't the same as good value.</li>
        <li>The value score hasn't been tested on past data because Yahoo doesn't provide historical P/E ratios. The conditions rules haven't been tested either.</li>
        <li>The conditions rules and the market labels (full of oil companies, tech-heavy and so on) are simplifications chosen for this tool.</li></ul>`)}
      ${fold("l-invest","Investing with it",`<ul>
        <li>Dollar returns suit a US-dollar investor. The pounds view converts them for a UK investor; your own currency's moves against the dollar change the result.</li>
        <li>Country funds charge fees, can have wide gaps between buying and selling prices, and may not be available in your country or tax-advantaged account.</li>
        <li>Smaller markets can be hit by capital controls, sanctions, changes to how index providers classify them, or sudden political change.</li>
        <li>Past performance does not guarantee future returns.</li></ul>`)}
    </div>
    <p class="disclaimer">For research and education only. This is not personalised investment advice. Check a fund's costs, holdings, risks and suitability for you before investing, and consider speaking to a licensed adviser.</p>
  </section>`;
}

        ${riskTile("Heat (RSI)",m.rsi==null?"–":`${m.rsi.toFixed(0)} · ${m.rsi>=70?"hot":m.rsi<=30?"cold":"normal"}`,"Compares the size of recent gains with recent losses over 14 trading days. 70 or more = sharp run-up; 30 or under = sharp fall.")}
        ${riskTile("Moves with world",m.corr==null?"–":m.corr.toFixed(2),"Correlation of weekly returns with world stocks over the past year: 1 = in step, 0 = unrelated. Lower = better for spreading risk.")}
        ${riskTile("Swing vs world (beta)",m.betaW==null?"–":`${m.betaW.toFixed(2)}×`,`From weekly returns over the past year: when world stocks moved 1%, ${r.name}'s fund moved about ${m.betaW==null?"–":m.betaW.toFixed(1)}% on average.`)}</div>
      <div class="card" style="padding:16px"><div class="eyebrow" style="margin-bottom:4px">What drives the score</div>
        <p class="note" style="margin:0 0 8px">Each bar ranks ${esc(r.name)} against all ${n} markets on one measure: 100 = best, 50 = middle, 0 = worst.</p>
        <div class="parts">${Object.entries(m.parts).map(([k,v])=>`<span title="${esc(partTip(k,"world stocks"))}">${esc(partName(k,"world stocks"))}</span><span class="bar"><i style="width:${v??0}%;background:${scoreColor(v??50)}"></i></span><span class="num" title="${v==null?"":esc(`Better than ${v}% of the ${n} markets on this measure. Counts for ${Math.round((S.data.weights[k]||0)*100)}% of the score.`)}">${v??"–"}</span>`).join("")}</div></div>
    </div>
    <div class="dgrid" data-pane="history">
      <div class="card chartbox"><div class="row"><span class="eyebrow">Main index (in ${esc(cp)}) vs the US fund (in US dollars), past year</span></div>
        <div class="row"><span class="key"><i style="background:var(--muted)"></i>${esc(r.index.name)} in ${esc(cp)}</span><span class="key"><i style="background:var(--accent)"></i>${esc(r.etf)} fund in US dollars</span></div>
        <div id="uchart"></div><p class="note">Both lines start at 0% a year ago. They are two different baskets of companies, so the gap comes from the currency and from what each holds. The fund line shows its price only (dividends not added back), so it can end below the fund's "1 year" figure.</p></div>
      ${m.relSeries?`<div class="card chartbox"><div class="row"><span class="eyebrow">${esc(r.name)} compared with all world stocks</span></div><div id="rchart"></div>
        <p class="note">In US dollars, starting at 0% a year ago. Above 0% = ${esc(r.name)} has done better than world stocks since then (+6% = money here grew to 6% more than the same money in world stocks). A rising line = gaining ground; a falling line = losing ground.</p></div>`:""}
      ${scoreHistoryCard("markets")}
      ${signalHistoryCard(S.data.changes,r.code)}
    </div>
    <div class="dgrid" data-pane="currency">
      ${fx?`<div class="card chartbox"><div class="row"><span class="eyebrow">The ${esc(cn)} against the US dollar</span>
          <span class="muted" style="font-size:12.5px">$1 buys ${money(fx.rate)} ${esc(cp)}</span></div>
        <div class="stats" style="grid-template-columns:repeat(4,1fr);margin-bottom:8px">${[["Latest session",fx.d1],["1 month",fx.m1],["1 year",fx.y1],["3 years",fx.y3]].map(([lab,v])=>`<div><span>${lab}</span><b class="${cls(v)}">${pct(v,1)}</b></div>`).join("")}</div>
        <div id="fchart"></div><p class="note">Up (+) = the ${esc(cn)} got stronger against the dollar, which adds to returns for US-dollar investors. ${fx.y1!=null?`Over the past year it ${fx.y1>=0?"rose":"fell"} ${pct(Math.abs(fx.y1),1,false)}, which ${fx.y1>=0?"added roughly that much to":"took roughly that much off"} a dollar investor's return.`:""}</p></div>`
        :`<div class="card" style="padding:16px"><div class="eyebrow">Currency</div><p class="muted" style="margin:6px 0 0">${r.code==="US"?"US market: no currency conversion for dollar investors.":"No currency data."}</p></div>`}
      <div class="card" style="padding:16px"><div class="eyebrow" style="margin-bottom:8px">Today's conditions for this market</div>
        <div class="chips" style="margin-bottom:10px">${traitChips(r)}</div>
        <div class="rules">${S.data.rules.filter(x=>x.active&&(x.tail.some(t=>r.traits.includes(t))||x.head.some(t=>r.traits.includes(t)))).map(x=>{ const helps=x.tail.some(t=>r.traits.includes(t));
          return `<div class="r"><div><span class="chip ${helps?"tail":"head"}">${helps?"Tends to help":"Tends to hurt"}</span> <b>${esc(x.name)}</b></div><div class="muted" style="font-size:13.5px">${esc(x.note)}</div></div>`; }).join("")||'<p class="muted" style="margin:0;font-size:13.5px">None of today\'s active rules affect this market directly.</p>'}</div></div>
    </div>
    <div class="dgrid" data-pane="fund">
      ${factsCard(r.facts||{},{bf:W.facts||{},bn:"World stocks",title:`Valuation and fund facts (${r.etf})`,note:`From Yahoo Finance, checked daily. Figures are for the ${r.etf} fund; world stocks = MSCI ACWI.`})}
      ${holdingsCard(r,S.data.holdingsAt,r.etf)}
    </div>
    <div class="dgrid" data-pane="background">
      <div class="card" style="padding:16px"><div class="eyebrow" style="margin-bottom:8px">The reasoning</div><ul class="why">${narrative(r).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
      <dl class="card primer"><dt>The market</dt><dd>${esc(info.market||"")}</dd><dt>Key drivers</dt><dd>${esc(info.drivers||"")}</dd><dt>Main risks</dt><dd>${esc(info.risks||"")}</dd>
        <dt>Tracked with</dt><dd>${r.index.proxy?`Our data source has no history for ${esc(r.name)}'s own index, so we use the ${esc(r.etf)} fund's price converted into ${esc(cp)} instead.`:`The ${esc(r.index.name)} index (Yahoo code ${esc(r.index.symbol)}) in ${esc(cp)}, and ${esc(r.etf)}, a US-listed fund holding ${esc(r.name)}'s shares, in US dollars.`}</dd></dl>
      ${peers.length?`<div class="card" style="padding:16px"><div class="eyebrow" style="margin-bottom:4px">Elsewhere in ${esc(r.region)} (score out of 100)</div>
        ${peers.map(p=>`<div class="idea" data-open="${p.code}" role="button" tabindex="0"><span class="nm">${esc(p.name)} <span class="muted" style="font-weight:400;font-size:13px">${esc(p.index.name)}</span></span>
          <span class="sc">${sigPill(p.m.signal,Math.round(p.m.score))}</span></div>`).join("")}</div>`:""}
    </div>`,()=>{S.sel=null;});
  d.querySelectorAll("[data-range]").forEach(bt=>bt.onclick=()=>{S.range=bt.dataset.range;d.querySelectorAll("[data-range]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.range===S.range));drawPrice(r);});
  bindDTabs(d,S.dtab,k=>{S.dtab=k;drawPane(r,k);});
}
// draw the charts of one panel tab (they measure their width, so only once visible)
function drawPane(r,k){
  const m=r.m, l=r.local, t=m.series.t;
  if(k==="summary") drawPrice(r);
  if(k==="history"){
    drawScoreHistory(m,S.data.histCuts);
    // align the local index onto the fund's dates (different exchange calendars)
    const lt=l.series.t, lc=l.series.c, lv=[]; let j=0;
    for(const ts of t){ while(j+1<lt.length&&lt[j+1]<=ts+43200) j++; lv.push(lt[j]<=ts+43200?lc[j]:null); }
    const base=a=>{const b=a.find(v=>v!=null); return a.map(v=>v==null?null:v/b*100);};
    lineChart($("#uchart"),{t,series:[{v:base(m.series.c),color:"var(--accent)",name:r.etf+" (US$)",w:1.8},{v:base(lv),color:"var(--muted)",name:r.index.name,w:1.4}],h:190,baseline:100,fmt:v=>pct(v/100-1,0)});
    if(m.relSeries) lineChart($("#rchart"),{t:t.slice(-m.relSeries.length),series:[{v:m.relSeries,color:"var(--accent)",name:"vs world stocks"}],h:160,baseline:100,fmt:v=>pct(v/100-1,1)});
  }
  if(k==="currency"&&r.fx&&$("#fchart")){ const sp=r.fx.spark, b=sp[0];
    lineChart($("#fchart"),{t:t.slice(-sp.length),series:[{v:sp.map(v=>v/b*100),color:"var(--info)",name:ccyName(r.index.ccy)+" vs start"}],h:140,baseline:100,fmt:v=>pct(v/100-1,1)}); }
}
function drawPrice(r){
  const l=r.local, dp=l.price>=100?0:2;
  document.querySelectorAll("#drawer .key.ma").forEach(k=>k.hidden=S.range!=="1y");
  if(S.range==="1y") return lineChart($("#pchart"),{t:l.series.t,series:[{v:l.series.c,color:"var(--ink)",name:"Index",w:1.8},{v:l.ma50,color:"var(--accent)",name:"50-day avg",w:1.2},{v:l.ma200,color:"var(--warn)",name:"200-day avg",w:1.2}],fmt:v=>v.toLocaleString(undefined,{maximumFractionDigits:dp}),area:1});
  const k=S.range==="5y"?252:l.long.t.length;
  lineChart($("#pchart"),{t:l.long.t.slice(-k),series:[{v:l.long.c.slice(-k),color:"var(--ink)",name:"Index",w:1.6}],fmt:v=>v.toLocaleString(undefined,{maximumFractionDigits:dp}),area:1});
}

/* ---------------------------------------------------------------- data loop */
Views.init(["overview","rankings","maps","conditions","record","guide"],{
  overview:()=>S.data&&renderMap(),
  maps:()=>{ if(!S.data) return; renderVM(); renderRRG(); },
  record:()=>{ if(!S.data) return; drawBacktest(S.data.backtest); drawPaper(S.data.paper,S.pcur,false); }});
startLoop({url:"world", onData(data){
  const reopen=S.sel, scrollY=window.scrollY;
  data.rows.forEach(r=>{ r.m.top10 = r.holdings&&r.holdings.length ? r.holdings.reduce((a,x)=>a+x.pct,0) : null; });
  S.data=data; render(); window.scrollTo(0,scrollY);
  if(reopen) openDetail(reopen);
}});
let rt; addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{ if(!S.data) return; Views.draw[Views.cur]?.();
  const r=S.sel&&byCode(S.sel); if(r) drawPane(r,S.dtab); },200);});
</script>
</body>

<main class="wrap" id="app"><div class="loading">Fetching live prices for sector and theme funds across 6 regions…</div></main>
<div class="tip" id="tip" hidden></div>

<script src="common.js"></script>
<script>
"use strict";
/* ---------------------------------------------------------------- static knowledge */
const SECTORS = {
  tech:   {name:"Technology", kind:"Cyclical growth", what:"Software, computer chips, hardware and IT services.",
           drivers:"How much businesses spend on IT and cloud services, spending on AI data centres, the boom-and-bust cycle in chip demand, profit growth.",
           rates:"A lot. Their profits are expected far in the future, so when interest rates rise, investors pay less for them today.",
           risks:"Prices falling back from high levels, export restrictions, a pause in AI spending, reliance on a few big customers."},
  fin:    {name:"Financials", kind:"Cyclical value", what:"Banks, insurers, brokers, asset managers and stock exchanges.",
           drivers:"Lending growth, the gap between what banks earn on loans and pay on deposits (bigger when long-term rates are well above short-term ones), bad-debt levels, deal-making and trading.",
           rates:"Helped when long-term rates rise above short-term ones; hurt when a recession brings more unpaid loans.",
           risks:"Loan defaults, customers pulling deposits, stricter rules, falling rates squeezing lending profits."},
  health: {name:"Health Care", kind:"Defensive", what:"Drug makers, biotech, medical devices, health insurers and services.",
           drivers:"New drugs and approvals, patents running out, ageing populations, government pricing rules.",
           rates:"Little for big drug makers; a lot for biotech, which relies on raising money.",
           risks:"Rules on drug prices, failed drug trials, patents expiring, cuts to what governments pay."},
  energy: {name:"Energy", kind:"Cyclical / inflation hedge", what:"Oil and gas producers, refiners, pipelines and oilfield services.",
           drivers:"Oil and gas prices, OPEC+ production decisions, how carefully companies spend, dividends and buybacks.",
           rates:"Little. It tends to do well when prices across the economy are rising.",
           risks:"A slump in oil prices, falling demand, windfall taxes, the shift to cleaner energy."},
  indu:   {name:"Industrials", kind:"Cyclical", what:"Aerospace and defence, machinery, transport, construction and trading houses.",
           drivers:"Business investment, factory activity surveys, infrastructure and defence budgets, freight volumes.",
           rates:"Some. Higher borrowing costs slow big projects.",
           risks:"A factory slowdown, supply-chain problems, tariffs and trade disputes."},
  discr:  {name:"Consumer Discretionary", kind:"Cyclical", what:"Things people want but don't need: cars, shops, travel, leisure, homebuilders, online retail.",
           drivers:"How confident shoppers feel, wages after inflation, how easy it is to borrow, the housing market.",
           rates:"A lot. Big purchases like cars and homes are often bought on credit.",
           risks:"Shoppers cutting back, rising unemployment, tariffs on imported goods."},
  staples:{name:"Consumer Staples", kind:"Defensive", what:"Everyday essentials: food, drinks, household and personal products, supermarkets.",
           drivers:"Steady demand, the ability to raise prices, ingredient and packaging costs, sales in emerging markets.",
           rates:"Some. Investors often treat them like bonds because of their steady dividends.",
           risks:"Rising costs, cheaper own-brand competition, weight-loss drugs reducing food sales."},
  util:   {name:"Utilities", kind:"Defensive / bond-like", what:"Electricity, gas and water companies and power producers.",
           drivers:"Profits set by regulators, electricity demand (including data centres), how much they spend on new plants and grids.",
           rates:"A lot. When interest rates rise, their dividends look less attractive next to safer bonds.",
           risks:"Rising interest rates, regulators' decisions, wildfire and storm damage claims."},
  mat:    {name:"Materials", kind:"Cyclical / commodity", what:"Chemicals, metals and mining, steel, building materials and gold miners.",
           drivers:"Commodity prices, demand from China, the US dollar, global factory output.",
           rates:"Little to some. A weaker dollar usually helps.",
           risks:"A China slowdown, too much supply, energy costs for European chemical makers."},
  re:     {name:"Real Estate", kind:"Rate-sensitive income", what:"Property companies and REITs (funds that own buildings): offices, warehouses, homes, data centres.",
           drivers:"How full buildings are, rents, property values, borrowing costs.",
           rates:"A lot. Property values usually fall when long-term interest rates rise.",
           risks:"Loans that must be refinanced at higher rates, empty offices, falling property values."},
  comm:   {name:"Communication Services", kind:"Mixed growth / defensive", what:"Telecoms, media, and online platforms such as search and social media.",
           drivers:"Advertising spending, subscriber growth, the cost of content, spending on mobile and fibre networks.",
           rates:"Some. Telecoms behave like bonds; online platforms behave like tech.",
           risks:"Advertising slumps, competition cases against big platforms, heavy network spending."},
};
const PHASE_COLORS = {"Early cycle":"var(--info)","Mid cycle":"var(--pos)","Late cycle":"var(--warn)","Contraction":"var(--neg)"};
const PHASE_PLAIN = {"Early cycle":"recovery","Mid cycle":"steady growth","Late cycle":"late expansion","Contraction":"recession"};
const phaseMix = cyc => cyc.phases.length>1? `a mix of ${cyc.phases.map(p=>PHASE_PLAIN[p]).join(" and ")}` : PHASE_PLAIN[cyc.phases[0]];
const MACRO_HINT = {
  "^VIX":"How big a swing investors expect in US shares over the next month. Under 16 = calm, over 25 = stressed. Spikes tend to favour steadier sectors like food, utilities and health care.",
  "^TNX":"What the US government pays to borrow for 10 years. When it rises, tech, utility and property shares usually suffer.",
  "CURVE":"How much more the US government pays to borrow for 10 years than for 3 months. Below zero ('inverted') has come before most US recessions.",
  "DX-Y.NYB":"The dollar against the euro, yen, pound and others; watch the direction. A strong dollar hurts US companies that sell abroad, commodities and emerging markets.",
  "CL=F":"Drives energy shares; a cost for airlines and chemical makers. Usually quoted per barrel (159 litres); shown here per litre.",
  "GC=F":"Bought as a safe haven in worrying times. Usually quoted per troy ounce (31.1 grams); shown here per gram.",
  "HG=F":"Copper goes into almost everything that gets built, so its price is a rough gauge of industrial demand. Shown per tonne (1,000 kg), the way the London Metal Exchange quotes it; US futures quote it per pound (0.45 kg).",
  "BTC-USD":"A gauge of how much risk investors are willing to take.",
};
const COLS = [
  {k:"r1d",l:"Today",cap:.02,tip:"Return today (or on the last trading day), including dividends"},
  {k:"r1w",l:"Week",cap:.04,tip:"Return over the last 5 trading days"},
  {k:"r1m",l:"1 mo",cap:.08,tip:"Return over the last month"},
  {k:"r3m",l:"3 mo",cap:.15,tip:"Return over the last 3 months"},
  {k:"ytd",l:"Since Jan 1",cap:.3,tip:"Return since 1 January"},
  {k:"r1y",l:"1 yr",cap:.4,tip:"Return over the last year"},
  {k:"r3y",l:"3 yr avg",cap:.2,tip:"Average yearly return over the last 3 years"},
];

/* ---------------------------------------------------------------- state */
const store = makeStore("sc.");
// "cur2": returns default to pounds (a new key, so a choice remembered from the old own-currency default doesn't carry over)
const S = {data:null, region:store.get("region","all"), q:"", sort:store.get("sort",{k:"score",dir:-1}),
           rrg:store.get("rrg","us"), sel:null, range:"1y", cur:store.get("cur2","gbp"), pcur:store.get("pcur","gbp"),
           cols:store.get("cols","key"), dtab:"summary", ibkr:store.get("ibkr",false), short:store.get("short","lead"),
           cyc:null, creg:store.get("creg","all"), crange:"all", ctab:"cycle", csel:null};
// returns in the chosen currency: each fund's own currency, or converted into pounds
// (falls back to each fund's own currency when the pound conversion is missing from the data)
const curNow = () => S.cur==="gbp" && S.data && !S.data.rows.some(r=>r.gbp) ? "local" : S.cur;
const rv = (r,k) => S.cur==="gbp" && r.gbp ? r.gbp[k] : r.m[k];
const curWord = () => curNow()==="gbp" ? "in pounds" : "in each fund's own currency";
const grp = id => (S.data.groups.find(g=>g.id===id)||{});
const groupName = id => grp(id).name||id;
const fundName = sym => { const r=S.data.rows.find(x=>x.symbol===sym); return r? `${r.name} (${groupShort(r.group)})` : sym; };
const groupShort = id => ({us:"US",global:"Global",europe:"Europe",japan:"Japan",canada:"Canada",themes:"Theme"})[id]||id;
// what each fund is compared with, in plain words ("the whole US market (S&P 500)") and short ("S&P 500")
const benchPlain = id => grp(id).plain||"its region's whole market";
const benchShort = id => grp(id).short||"the whole market";
const REGION_MKT = "the whole stock market of its region";
function vsListText(){ // "US sectors and themes vs the S&P 500, ..." built from the data so it stays in sync with universe.py
  const g=id=>grp(id).bench_name;
  return `US sectors and themes vs the ${g("us")}, European vs the ${g("europe")}, Japanese vs ${g("japan")}, Canadian vs the ${g("canada")}, and global sector funds vs all world stocks (${g("global")})`;
}

/* ---------------------------------------------------------------- narrative */
function narrative(r){
  const m=r.m, bp=benchPlain(r.group), bench=S.data.benches[r.group]||{}, out=[];
  const gb=S.cur==="gbp", sign=gb?"£":(CCY_SIGN[r.ccy]||""), fy=gb?(r.gbp||{}).r1y:m.r1y, by=gb?(bench.gbp||{}).r1y:null;
  if(m.r1y!=null){
    let s=`${m.r1y>=0?"Up":"Down"} ${pct(Math.abs(m.r1y),1,false)} over the past year${gb?" in its own currency":""}.`;
    if(m.rs1y!=null){ const br=m.r1y-m.rs1y, shown=(+(m.r1y*100).toFixed(1) - +(br*100).toFixed(1))/100;
      s+=` ${bp[0].toUpperCase()+bp.slice(1)} ${br>=0?"rose":"fell"} ${pct(Math.abs(br),1,false)}, so this did ${betterWorse(shown)}.`;
      const b1=gb?by:br;
      if(sign&&fy!=null&&b1!=null) s+=` ${sign}1,000 put in a year ago would now be about ${sign}${Math.round(1000*(1+fy)).toLocaleString()}, against ${sign}${Math.round(1000*(1+b1)).toLocaleString()} in ${benchShort(r.group)==="world stocks"?"world stocks":"the "+benchShort(r.group)}${gb?" (in pounds)":""}.`; }
    out.push(s);
  }
  out.push(m.trend===4?"Clear uptrend: the price is above its average over the last 50 trading days (about 2½ months) and 200 trading days (about 10 months), and the 10-month average is rising."
    : m.trend===0?"Clear downtrend: the price is below both its 50-day and 200-day averages, and the 200-day average is falling."
    : m.vs200>0?`Mixed trend: it passes ${m.trend} of 4 uptrend checks, and is still above its 200-day (about 10-month) average price.`
    : `Mixed trend: it passes ${m.trend} of 4 uptrend checks, and is below its 200-day (about 10-month) average price, so the long-term trend is not yet repaired.`);
  const qs=quadSentence(m.quad,bp); if(qs) out.push(`Rotation (${m.quad}): ${qs}`);
  const ht=historyText(m,false); if(ht) out.push("Score changes (out of 100): "+ht);
  const bf=bench.facts||{};
  if(m.pe!=null&&bf.pe) out.push(`Price vs profits: buyers pay ${m.pe.toFixed(1)} times the last year's profits here (P/E), against ${bf.pe.toFixed(1)} for ${bp}, `+
    (Math.abs(m.peRel)<0.05?"about the same."
     :`so it is ${pct(Math.abs(m.peRel),0,false)} ${m.peRel>0?"pricier":"cheaper"}.`+
      (m.peRel>0.25?" Investors are paying up for expected growth, so disappointments can hurt."
       :m.peRel<-0.2?" Often cheap for a reason, but low expectations can cushion bad news.":"")));
  if(m.vol!=null){ const bv=(bench.m||{}).vol;
    out.push(`Risk: over the last 3 months its volatility (a measure of typical daily ups and downs, scaled to a year; higher = bumpier) was ${pct(m.vol,0,false)}${bv?`, against ${pct(bv,0,false)} for the ${benchShort(r.group)}`:""}. `+
      `Its biggest drop in the past year was ${pct(Math.abs(m.mdd),1,false)}, and ${m.offHigh>-0.005?"it is at or very near its highest price of the past year":`it is now ${pct(Math.abs(m.offHigh),1,false)} below its highest price of the past year`}.`); }
  if(m.rsi!=null){ if(m.rsi>=70) out.push(`Timing: its recent gains have been much bigger than its recent losses (RSI ${m.rsi.toFixed(0)}; 70 or more is called 'overbought'). Buying right after a sharp run-up carries the risk of a short-term dip.`);
    else if(m.rsi<=30) out.push(`Timing: its recent losses have been much bigger than its recent gains (RSI ${m.rsi.toFixed(0)}; 30 or under is called 'oversold'). Short bounces are common, but it can also keep falling.`);
    else out.push(`Timing: RSI ${m.rsi.toFixed(0)}: it has not risen or fallen unusually fast lately.`); }
  const cyc=S.data.cycle, fav=cyc.favoured, phase=phaseMix(cyc);
  out.push(fav.includes(r.key) ? `Economic cycle: our US market signals point to ${phase} (see the Overview tab), and this sector has tended to do well then.`
                                                    : `Economic cycle: our US market signals point to ${phase} (see the Overview tab), when this sector has not usually led.`);
  return out;
}
function reasonShort(r){
  const m=r.m, bits=[];
  if(m.rs1y!=null) bits.push(`${aheadBehind(m.rs1y,0)} ${relPrep(m.rs1y)}${benchShort(r.group)==="world stocks"?"world stocks":"the "+benchShort(r.group)} over the past year`);
  bits.push(TREND_WORD[m.trend]);
  if(m.quad) bits.push(QUAD_PLAIN[m.quad]);
  if(m.d1w!=null&&Math.abs(m.d1w)>=1) bits.push(`score ${m.d1w>0?"up":"down"} ${Math.round(Math.abs(m.d1w))} this week`);
  if(m.rsi>=70) bits.push("rose fast recently"); if(m.rsi<=30) bits.push("fell fast recently");
  return bits.join(" · ");
}

/* ---------------------------------------------------------------- render: page */
function filtered(){
  const q=S.q.trim().toLowerCase();
  return S.data.rows.filter(r=>(S.region==="all"||r.group===S.region) && (!S.ibkr||r.buy) &&
    (!q || (r.name+" "+r.symbol+" "+r.fund+" "+groupName(r.group)+" "+(SECTORS[r.key]||{}).name).toLowerCase().includes(q) || holdingMatch(r)));
}
function sorted(rows){
  const {k,dir}=S.sort, get = r => k==="name"?r.name : k==="buy"?(r.buy&&r.buy.ticker) : k==="quad"?["Lagging","Improving","Weakening","Leading"].indexOf(r.m.quad) : COLS.some(c=>c.k===k)? rv(r,k) : r.m[k];
  return rows.slice().sort((a,b)=>{ const x=get(a), y=get(b); if(x==null) return 1; if(y==null) return -1;
    return (typeof x==="string"? x.localeCompare(y) : x-y)*dir; });
}

function render(){
  const D=S.data, app=$("#app"), n=D.rows.length;
  // a remembered choice from an older version (e.g. the removed "Countries" group) falls back to a valid one
  if(S.region!=="all"&&!D.groups.some(g=>g.id===S.region)) S.region="all";
  if(!D.groups.some(g=>g.id===S.rrg)) S.rrg="us";
  if(!COLSETS.some(([k])=>k===S.cols)) S.cols="key";
  app.innerHTML = `
  <div class="view" data-view="overview">
    <div class="intro">${icon("info",17)}<span>Each sector fund is compared with <b>the whole stock market of its own region</b> (US Technology with the S&amp;P 500, for example) and given a <b>score from 0 to 100</b>: 50 is the middle, 60 or more is favoured, under 40 is weak. It describes what has been happening, not what will happen. <a href="#guide">How to read this page</a></span></div>
    <section>${secHead({eyebrow:"At a glance",title:"Today in sectors"})}${heroGrid(heroCards())}</section>
    ${longRunSection()}
    ${openSection()}
    <section>${secHead({eyebrow:"Shortlist",title:"What the data favours today",lead:`The strongest, the improving and the weakest of all ${n} funds, one list at a time. Click a card for the full breakdown.`,right:trustBadge(D.backtest)})}
      ${more("shortlist",`<p>The score combines how each fund has done against the whole stock market of its region (over 3, 6 and 12 months), how healthy its price trend is, its gain for the risk taken, and the size of its biggest recent drop.</p><p><b>Turnaround watch</b> lists funds that have been behind their region's market lately but are improving; this list hasn't been tested on past data on its own. Read the <a href="#limits">limitations</a> before acting on any of it.</p>`)}
      <div class="toolbar">${seg("short",S.short,SHORTLISTS.map(([k,l,ico])=>[k,icon(ico,14)+l]),"Which list")}</div>
      <div id="shortbox">${ideas()}</div></section>
    <section id="economy">${secHead({eyebrow:"Economic backdrop",title:"Where is the economy in its cycle?",lead:`An automatic read of US market signals, because different sectors have tended to lead in different phases (for single cyclical indices, such as FTSE 350 Mining, see the <a href="#cycles">Cycles tab</a>).`})}
      <div class="backdrop">${cycleCard()}<div class="macro">${macroTiles()}</div></div>
      <div style="margin-top:10px">${more("macro-how",macroHints(),"What these measures mean")}</div></section>
    ${changesSection(D.changes,{nameOf:fundName,noun:"funds"})}
  </div>

  <div class="view" data-view="rankings">
    <section id="ranking">${secHead({eyebrow:"Full ranking",title:"Every sector, scored",lead:`All ${n} funds. Click a row for its full breakdown, or a column header to sort.`})}
      <div class="toolbar"><div class="tabs" role="group" aria-label="Region">${[["all","All"],...D.groups.map(g=>[g.id,groupShort(g.id)])].map(([id,l])=>
          `<button class="tab" type="button" data-region="${id}" aria-pressed="${S.region===id}">${esc(l==="Theme"?"Themes":l)}</button>`).join("")}</div>
        <input class="search" id="search" type="search" placeholder="Search sector, ticker or company (e.g. Nvidia)" value="${esc(S.q)}" aria-label="Search"></div>
      <div class="toolbar"><span class="seg-lab">Columns</span>${seg("cols",S.cols,COLSETS,"Columns to show")}
        <span class="seg-lab">Returns in</span>${seg("cur",curNow(),[["gbp","Pounds (£)"],["local","Own currency"]],"Return currency")}
        <div class="tabs" role="group" aria-label="Buyable on IBKR"><button class="tab" type="button" id="ibkrOnly" aria-pressed="${S.ibkr}" title="Hide funds that a UK investor can't buy on IBKR (no UCITS version)">Only ones I can buy on IBKR</button></div></div>
      <div class="tablebox" id="tablebox"></div>
      <div style="margin-top:10px">${more("glossary",glossary(n),"What do the columns mean?")}</div></section>
  </div>

  <div class="view" data-view="maps">
    <section>${secHead({eyebrow:"Maps",title:"Where sectors stand",lead:"Who is gaining on their market right now, and how each sector scores in each region."})}
    <div class="two">
      <div class="card panel rrgbox">${secHead({eyebrow:"Rotation map",title:"Who is gaining on their region's market?",h:"h3",
          right:`<select id="rrgsel" class="btn" aria-label="Region for rotation map">${D.groups.map(g=>`<option value="${g.id}" ${S.rrg===g.id?"selected":""}>${esc(g.name)}</option>`).join("")}</select>`})}
        <p class="note" id="rrgcap" style="margin:0 0 8px"></p>
        ${more("rrg-how",`<p>Right of centre = doing better than its region's whole market lately (named above the map); left = doing worse. Above centre = gaining ground; below = losing ground. Funds tend to circle clockwise: Improving → Leading → Weakening → Lagging. The big dot is today; the line behind it shows where it stood each week for the last 5 weeks. Click a dot for the full breakdown.</p>`,"How to read this map")}
        ${trailKey("where it was each week, last 5 weeks")}<div id="rrg"></div></div>
      <div class="card panel">${secHead({eyebrow:"Across regions",title:"Same sector, different region",h:"h3"})}
        <p class="note" style="margin:0 0 8px">Average score (0–100) of each sector's funds in each region: green = strong, red = weak. Click a cell for its best fund.<br><span class="fit">✓</span> = usually does well in the economy's current phase.</p>
        ${more("matrix-how",`<p>Each fund is judged against its own region's whole stock market, so this shows where a sector is strong within its region; it doesn't directly compare one region's returns with another's. ✓ = this sector has usually done well in the economy's current phase.</p>`,"How to read this table")}
        <div style="overflow-x:auto">${matrix()}</div></div>
    </div></section>
  </div>

  <div class="view" data-view="cycles"><div id="cycbox"></div></div>

  <div class="view" data-view="record">
    ${paperSection(D.paper,{noun:"sector funds",nameOf:fundName,mkt:"each holding's own regional market",cur:S.pcur})}
    ${backtestSection(D.backtest,{noun:"funds",one:"fund",vs:"the whole stock market of their own region",vsShort:"their region's whole market",vsList:vsListText()})}
  </div>

  <div class="view" data-view="guide">${guide(n)}</div>`;

  renderTable(); restoreOpen(app); Views.apply();
  const press=(attr,v)=>app.querySelectorAll(`[data-${attr}]`).forEach(x=>x.setAttribute("aria-pressed",x.dataset[attr]===v));
  app.querySelectorAll("[data-cur]").forEach(b=>b.onclick=()=>{S.cur=b.dataset.cur;store.set("cur2",S.cur);press("cur",S.cur);renderTable();});
  bindSeg(app,"short",v=>{ S.short=v; store.set("short",v); $("#shortbox").innerHTML=ideas(); });
  app.querySelectorAll("[data-cols]").forEach(b=>b.onclick=()=>{S.cols=b.dataset.cols;store.set("cols",S.cols);press("cols",S.cols);renderTable();});
  app.querySelectorAll("[data-region]").forEach(b=>b.onclick=()=>{S.region=b.dataset.region;store.set("region",S.region);press("region",S.region);renderTable();});
  app.querySelectorAll("[data-pcur]").forEach(b=>b.onclick=()=>{S.pcur=b.dataset.pcur;store.set("pcur",S.pcur);const y=scrollY;render();scrollTo(0,y);});
  $("#search").oninput=e=>{S.q=e.target.value;renderTable();};
  $("#ibkrOnly").onclick=e=>{S.ibkr=!S.ibkr;store.set("ibkr",S.ibkr);e.currentTarget.setAttribute("aria-pressed",S.ibkr);renderTable();};
  $("#rrgsel").onchange=e=>{S.rrg=e.target.value;store.set("rrg",S.rrg);renderRRG();};
}

/* ---------------------------------------------------------------- overview */
function heroCards(){
  const D=S.data, rs=D.rows.filter(r=>r.m.score!=null), n=rs.length, cyc=D.cycle;
  const top=rs.slice().sort((a,b)=>b.m.score-a.m.score)[0];
  const riser=rs.filter(r=>r.m.d1w!=null).sort((a,b)=>b.m.d1w-a.m.d1w)[0];
  const up=rs.filter(r=>r.m.vs200!=null&&r.m.vs200>0).length, vix=(D.macro||{})["^VIX"];
  const mood=v=>v<16?"Calm":v<=25?"Normal":"Stressed";
  return [
    stat({label:"Economic read",ico:"conditions",href:"#economy",value:`<i class="dotc" style="background:${PHASE_COLORS[cyc.primary]}"></i>${esc(cyc.phase)}`,
      body:`<div class="phasebar">${Object.entries(cyc.weights).map(([k,v])=>`<i style="flex:${v};background:${PHASE_COLORS[k]}" title="${esc(k)}: ${Math.round(v*100)}% of the evidence"></i>`).join("")}</div>`,
      sub:esc(cap(phaseMix(cyc)))}),

function pickRow(r){

function matrix(){
  const regs=["us","global","europe","japan","canada","themes"], keys=Object.keys(SECTORS);
  const fav=S.data.cycle.favoured;
  const cell=(k,g)=>{ const rs=S.data.rows.filter(r=>r.key===k&&r.group===g&&r.m.score!=null);
    if(!rs.length) return `<td class="cell empty" title="No fund for this sector here">·</td>`;
    const avg=rs.reduce((a,r)=>a+r.m.score,0)/rs.length, best=rs.slice().sort((a,b)=>b.m.score-a.m.score)[0];
    const t=(avg-50)/50, bg=`color-mix(in oklab,var(${t>0?"--pos":"--neg"}) ${Math.round(Math.abs(t)*55)}%,transparent)`;
    return `<td class="cell" style="background:${bg}" data-open="${esc(best.symbol)}" title="${esc(rs.map(r=>r.name+" "+Math.round(r.m.score)).join(", "))}">${Math.round(avg)}</td>`; };
  return `<table class="matrix"><thead><tr><th class="l"></th>${regs.map(g=>`<th title="${esc("Compared with "+benchPlain(g))}">${esc(g==="themes"?"Themes (US-listed)":groupShort(g))}</th>`).join("")}</tr></thead>

}

      ${peers.length?`<div class="card" style="padding:16px"><div class="eyebrow" style="margin-bottom:4px">${esc(sec.name)} elsewhere (score out of 100)</div>
        ${peers.map(p=>`<div class="idea" data-open="${esc(p.symbol)}" role="button" tabindex="0"><span class="nm">${esc(p.name)} <span class="muted" style="font-weight:400;font-size:13px">${esc(groupShort(p.group))} · ${esc(p.symbol)} · vs ${esc(benchShort(p.group))}</span></span>
          <span class="sc">${sigPill(p.m.signal,Math.round(p.m.score))}</span></div>`).join("")}</div>`:""}
    </div>`,()=>{S.sel=null;});
  d.querySelectorAll("[data-range]").forEach(bt=>bt.onclick=()=>{S.range=bt.dataset.range;d.querySelectorAll("[data-range]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.range===S.range));drawPrice(r);});
  bindDTabs(d,S.dtab,k=>{S.dtab=k;drawPane(r,k);});
}
// draw the charts of one panel tab (they measure their width, so only once visible)
function drawPane(r,k){
  const m=r.m;
  if(k==="summary") drawPrice(r);
  if(k==="history"){ drawScoreHistory(m,S.data.histCuts);
    if(m.relSeries) lineChart($("#rchart"),{t:m.series.t.slice(-m.relSeries.length),series:[{v:m.relSeries,color:"var(--accent)",name:"vs "+benchShort(r.group)}],h:170,baseline:100,fmt:v=>pct(v/100-1,1)}); }
}
function holdingMatch(r){
  const q=S.q.trim().toLowerCase(); if(!q||!r.holdings) return null;
  return r.holdings.find(x=>x.name.toLowerCase().includes(q)||x.sym.toLowerCase()===q) || null;
}
function drawPrice(r){
  const m=r.m, dp=m.price>=100?0:2;
  document.querySelectorAll("#drawer .key.ma").forEach(k=>k.hidden=S.range!=="1y");
  if(S.range==="1y") return lineChart($("#pchart"),{t:m.series.t,series:[{v:m.series.c,color:"var(--ink)",name:"Price",w:1.8},{v:m.ma50,color:"var(--accent)",name:"50-day avg",w:1.2},{v:m.ma200,color:"var(--warn)",name:"200-day avg",w:1.2}],fmt:v=>v.toFixed(dp),area:1});
  const k=S.range==="5y"?252:m.long.t.length;
  lineChart($("#pchart"),{t:m.long.t.slice(-k),series:[{v:m.long.c.slice(-k),color:"var(--ink)",name:"Price",w:1.6}],fmt:v=>v.toFixed(dp),area:1});
}

/* ---------------------------------------------------------------- cycles: cyclical indices (cycles.py), loaded when the tab opens */
const PHASE_TONE = {"Down and still falling":"neg","Down but turning up":"info","Up and still rising":"pos","Up but turning down":"warn"};
const PHASE_SHORT = {"Down and still falling":"Falling","Down but turning up":"Turning up","Up and still rising":"Rising","Up but turning down":"Turning down"};
const PHASE_HELP = {
  "Down and still falling":"Below its 5-year average and its 200-day average: low in its recent cycle and still heading down.",
  "Down but turning up":"Below its 5-year average but back above its 200-day average: low in its recent cycle, and has started to recover.",
  "Up and still rising":"Above its 5-year average and its 200-day average: high in its recent cycle and still heading up.",
  "Up but turning down":"Above its 5-year average but below its 200-day average: high in its recent cycle, and has started to slip."};
const PHASE_COL = p => `var(--${PHASE_TONE[p]||"muted"})`;
const phaseTag = p => p? tag(esc(p),PHASE_TONE[p]||"",`title="${esc(PHASE_HELP[p]||"")}"`) : "";
const dipLine = () => (S.cyc&&S.cyc.dipLine)||-0.3;
const isDeep = r => r.dd5!=null && r.dd5<=dipLine();
const dipTag = r => isDeep(r)? tag("Deep dip","dip",`title="${esc(`${pct(Math.abs(r.dd5),0,false)} below its highest close of the past 5 years (30% or more counts as a deep dip)`)}"`) : "";
const lvl = v => v==null? "–" : v>=1000? Math.round(v).toLocaleString() : v.toFixed(2);
const dayStr = ts => new Date(ts*1000).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"});
const yearOf = ts => new Date(ts*1000).getUTCFullYear();
const regName = r => ((S.cyc.regions||{})[r.region]||{}).name||r.region;
const fallsOf = r => (r.falls||[]).map(f=>f.fall);
const medianOf = a => { const s=a.slice().sort((x,y)=>x-y); return s.length? s[Math.floor(s.length/2)] : null; };
const belowHigh = (v,dp=0) => v>-0.005? "at its 5-year high" : `${pct(Math.abs(v),dp,false)} below its 5-year high`;
const vtag = v => tag(esc(v), v==="Probably worked"?"pos":v==="Possibly worked"?"warn":"neg");
// the test's verdict in words for the headline cards (the p-values themselves are in "How the test worked")
const evidenceWord = v => v==="Probably worked"?"Convincing evidence, unlikely to be luck":v==="Possibly worked"?"Some evidence, not proof: it could still be luck":"No reliable gain";
const pval = p => p==null? "–" : p<0.001? "under 0.1%" : pct(p,1,false);
const monthsWord = m => m>=24? `${(m/12).toFixed(1).replace(/\.0$/,"")} years` : `${Math.max(1,Math.round(m))} month${Math.round(m)===1?"":"s"}`;
// month-end closes for the long chart: from the first full month, plus today
const longSeries = r => { const d=new Date(r.long.ym0*1000), n=r.long.c.length;
  return {t:r.long.c.map((_,i)=>i===n-1? r.at : Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+i+1,0)/1000), c:r.long.c}; };

async function loadCycles(){
  if(S.cycLoading) return; S.cycLoading=true; S.cycTried=Date.now();
  try{ const res=await fetch(STATIC?`api/cycles.json?t=${Date.now()}`:"/api/cycles",{cache:"no-store"});
    if(!res.ok) throw new Error("Server replied "+res.status);
    S.cyc=await res.json(); S.cycAt=Date.now(); S.cycErr=null;
  }catch(e){ S.cycErr=e.message; }
  finally{ S.cycLoading=false; }
  if(Views.cur==="cycles") drawCycles();
}
function drawCycles(){
  const box=$("#cycbox"); if(!box) return;
  const stale=!S.cyc||Date.now()-(S.cycAt||0)>15*60*1000;
  if(stale&&!S.cycLoading&&Date.now()-(S.cycTried||0)>60*1000) loadCycles();
  if(!S.cyc){ box.innerHTML=S.cycErr?`<div class="loading err">Couldn't load the cyclical indices: ${esc(S.cycErr)}.</div>`:'<div class="loading">Loading the cyclical indices…</div>'; return; }
  if(!S.cyc.rows.length){ box.innerHTML=`<div class="loading err">The cyclical indices are unavailable right now${S.cyc.errors&&S.cyc.errors.length?` (${esc(S.cyc.errors.join(", "))})`:""}. They come from CNBC; the next update will try again.</div>`; return; }
  box.innerHTML=cyclesHTML(); restoreOpen(box);
  box.querySelectorAll("[data-creg]").forEach(b=>b.onclick=()=>{ S.creg=b.dataset.creg; store.set("creg",S.creg); drawCycles(); });
  cycleClock($("#cyclock"),cycRows());
}
const cycRows = () => S.cyc.rows.filter(r=>S.creg==="all"||r.region===S.creg).sort((a,b)=>a.dd5-b.dd5);

// how far below its 5-year high: right end = at the high, left end = 90% below; shaded = the deep-dip zone.
// One bar colour throughout. The list shows one marker (its typical big fall); the index's own panel adds its worst fall.
const DIP_SCALE = 0.9;
function dipBar(r,big=false){
  const x = v => (Math.min(DIP_SCALE,Math.abs(v))/DIP_SCALE*100).toFixed(1), fs=fallsOf(r), typ=medianOf(fs), worst=fs.length?Math.min(...fs):null, d=r.dd5;
  const say=[cap(belowHigh(d)), typ!=null?`its typical big fall ${pct(Math.abs(typ),0,false)}`:"", worst!=null?`its worst ${pct(Math.abs(worst),0,false)}`:""].filter(Boolean).join("; ");
  return `<div class="dipbar${big?" big":""}" role="img" aria-label="${esc(say)}" title="${esc(say)}">
    <i class="zone" style="right:${x(dipLine())}%"></i>
    <i class="fill" style="width:calc(${x(d)}% - 2px);background:var(--accent)"></i>
    ${typ!=null?`<i class="typ" style="right:${x(typ)}%" title="${esc(`Its typical big fall: ${pct(Math.abs(typ),0,false)} (the median of ${fs.length})`)}"></i>`:""}
    ${big&&worst!=null?`<i class="worst" style="right:${x(worst)}%" title="${esc(`Its worst fall: ${pct(Math.abs(worst),0,false)}`)}"></i>`:""}</div>`;
}
const dipLegend = (big=false) => `<div class="diplegend"><span><i class="lg-fill"></i>How far below its 5-year high today</span><span><i class="lg-zone"></i>Deep-dip zone (30% or more below)</span>
  <span><i class="lg-typ"></i>Its typical big fall</span>${big?'<span><i class="lg-worst"></i>Its worst fall</span>':""}</div>`;
function dipRow(r){
  const sp=sparkSVG(r.long.c.slice(-61),{w:84,h:28});
  return `<div class="diprow" data-open="cyc:${esc(r.key)}" role="button" tabindex="0" title="${esc(`${PHASE_HELP[r.phase]||""} ${pct(r.vs5y,0)} vs its 5-year average, ${pct(r.vs200,0)} vs its 200-day average.`)}">
    <div class="dr-name"><b>${esc(r.name)} <span class="dr-reg">${esc(regName(r))}</span></b><span class="dr-sub">${esc(r.full)}</span><span class="dr-tags">${phaseTag(r.phase)}${dipTag(r)}</span></div>
    <div class="dr-bar">${dipBar(r)}<div class="dr-meta"><span>1 yr <b class="${cls(r.r1y)}">${pct(r.r1y,0)}</b></span></div></div>
    <div class="dr-val"><b class="${r.dd5<=dipLine()?"dip":""}">${r.dd5>-0.005?"0%":pct(r.dd5,0)}</b><small>from its 5-yr high</small></div>${sp}</div>`;
}

function cyclesHTML(){
  const C=S.cyc, T=C.test, A=T&&T.rules.dip, rows=cycRows(), all=C.rows, deep=all.filter(isDeep).sort((a,b)=>a.dd5-b.dd5);
  const mk=C.markets||{}, near=all.filter(r=>r.dd5>-0.1).length;
  const regTabs=`<div class="tabs" role="group" aria-label="Region">${[["all","All"],["uk","UK"],["europe","Europe"],["us","US"]].map(([k,l])=>
    `<button class="tab" type="button" data-creg="${k}" aria-pressed="${S.creg===k}">${l}</button>`).join("")}</div>`;
  // the test of buying dips has its own section below ("Does buying the dip pay?"), so these tiles only describe today
  const tiles=[
    stat({label:"In a deep dip now",ico:"down",value:`${deep.length} <small class="of">of ${all.length}</small>`,
      body:deep.length?`<div class="pick-tags">${deep.slice(0,5).map(r=>tag(esc(`${r.name} (${regName(r)}) ${pct(r.dd5,0)}`),"dip",`data-open="cyc:${esc(r.key)}"`)).join("")}</div>`:"",
      sub:`30% or more below their highest close of the past 5 years.${T?` <a href="#cyctest">Has buying at such moments paid?</a>`:""}`}),
    stat({label:"Whole markets",ico:"globe",body:`<div class="mklist">${["uk","europe","us"].filter(k=>mk[k]).map(k=>`<div><span>${esc(mk[k].name)}</span><b class="${mk[k].dd5<=-0.1?"neg":""}">${mk[k].dd5>-0.005?"0%":pct(mk[k].dd5,0)}</b></div>`).join("")}</div>`,
      sub:`From their 5-year highs. ${near} of the ${all.length} cyclical indices are within 10% of theirs.`}),
  ];
  return `<div class="intro">${icon("cycles",17)}<span><b>Indices, not funds:</b> ${all.length} stock-market indices for industries that boom and bust with the economy and with commodity prices, such as mining, oil, banks, chips and housebuilding. See how far each is below its recent peak, whether it is still falling or turning up, and how its past dips played out. Click any index for its full history.</span></div>
  <section>${secHead({eyebrow:"Cycles",title:"Where is each cyclical index in its cycle?"})}${heroGrid(tiles)}</section>
  <section>${secHead({eyebrow:"Dip meter",title:"How far below its peak",lead:"Deepest first. The bar runs from the 5-year high (right) to 90% below it (left).",right:regTabs})}
    ${more("dip-how",`<p><b>From its 5-year high:</b> how far the index is below its highest close of the past five years. Cyclical industries often fall 40% or more in a downturn; the markers show how deep this index's own past big falls went.</p>
      <p><b>Deep dip</b> = 30% or more below. Buying at that depth has beaten buying at any time on average in our test (below), but often only after falling further first.</p>
      <p><b>The phase</b> combines two simple measures. Below its <b>5-year average</b> = low in its recent cycle; above = high. Above its <b>200-day average</b> (about 10 months) = rising lately; below = falling. ${Object.keys(PHASE_TONE).map(p=>phaseTag(p)).join(" ")}</p>`,"How to read the dip meter")}
    ${dipLegend()}<div class="dipscale" aria-hidden="true"><span class="ds-bar"><span>−90%</span><span>5-yr high</span></span></div>
    <div class="diplist">${rows.map(dipRow).join("")}</div></section>
  <section><div class="card panel">${secHead({eyebrow:"Cycle clock",title:"Low or high in the cycle, falling or rising",h:"h3"})}
    ${more("clock-how",`<p>Left of centre = below its 5-year average (low in its recent cycle); right = above it. Above centre = above its 200-day average (rising lately); below = falling. Indices tend to go round clockwise: <b>turning up</b> (top left) → <b>rising</b> (top right) → <b>turning down</b> (bottom right) → <b>falling</b> (bottom left). The big dot is today; the line behind it shows where it stood at each of the last 3 month-ends. The across scale is compressed, so the very big moves (some indices are 100% or more above their 5-year average) fit without squashing the rest. Click a dot for its history.</p>`,"How to read the clock")}
    ${trailKey("where it was at each of the last 3 month-ends")}<div id="cyclock"></div></div></section>
  ${cycleTestSection(T)}`;
}

/* where each index sits: x = vs its 5-year average, y = vs its 200-day average (both on a ratio scale) */
function cycleClock(el,rows){
  if(!el) return;
  const W=Math.max(300,el.clientWidth||560), H=Math.round(Math.min(Math.max(W*0.62,300),500)), PL=40, PR=14, PT=12, PB=38, lg=v=>Math.log(1+v);
  // very far from average (chips at +150%) is drawn at the edge, so the rest stay readable
  const CX=[lg(-0.6),lg(1)], CY=[lg(-0.3),lg(0.3)], clamp=(v,[a,b])=>Math.max(a,Math.min(b,v));
  const trails=rows.map(r=>r.trail.slice(-4).map(p=>[clamp(lg(p[0]),CX),clamp(lg(p[1]),CY)]));
  const all=trails.flat(); if(!all.length){ el.innerHTML='<p class="muted">No indices to show.</p>'; return; }
  const x0=Math.min(-0.2,...all.map(p=>p[0]))-0.05, x1=Math.max(0.2,...all.map(p=>p[0]))+0.05;
  const y0=Math.min(-0.1,...all.map(p=>p[1]))-0.03, y1=Math.max(0.1,...all.map(p=>p[1]))+0.03;
  const X=v=>PL+(v-x0)/(x1-x0)*(W-PL-PR), Y=v=>PT+(1-(v-y0)/(y1-y0))*(H-PT-PB), cx=X(0), cy=Y(0), bot=H-PB, taken=[];
  const corner=(x,y,anchor,p,sub,below)=>quadName(x,y,anchor,PHASE_COL(p),esc(PHASE_SHORT[p].toUpperCase()),esc(W<480?sub.replace(" in its cycle",""):sub),below,taken);
  let s=`<rect x="${PL}" y="${PT}" width="${cx-PL}" height="${cy-PT}" fill="var(--info)" fill-opacity=".06"/>
    <rect x="${cx}" y="${PT}" width="${W-PR-cx}" height="${cy-PT}" fill="var(--pos)" fill-opacity=".06"/>
    <rect x="${cx}" y="${cy}" width="${W-PR-cx}" height="${bot-cy}" fill="var(--warn)" fill-opacity=".06"/>
    <rect x="${PL}" y="${cy}" width="${cx-PL}" height="${bot-cy}" fill="var(--neg)" fill-opacity=".06"/>
    <line x1="${PL}" x2="${W-PR}" y1="${cy}" y2="${cy}" stroke="var(--line)"/><line x1="${cx}" x2="${cx}" y1="${PT}" y2="${bot}" stroke="var(--line)"/>
    ${corner(PL+6,PT+16,"start","Down but turning up","low in its cycle, rising",true)}
    ${corner(W-PR-6,PT+16,"end","Up and still rising","high in its cycle, rising",true)}
    ${corner(W-PR-6,bot-8,"end","Up but turning down","high in its cycle, slipping",false)}
    ${corner(PL+6,bot-8,"start","Down and still falling","low in its cycle, falling",false)}`;
  [-0.5,-0.4,-0.2,0,0.25,0.5,1].forEach(v=>{ const x=lg(v); if(x<x0||x>x1) return;
    s+=`<line x1="${X(x)}" x2="${X(x)}" y1="${bot}" y2="${bot+4}" stroke="var(--faint)"/><text x="${X(x)}" y="${bot+15}" text-anchor="middle" font-size="11.5" fill="var(--muted)">${v>=1?"≥ +100%":v?pct(v,0):"5-yr avg"}</text>`; });
  [-0.2,-0.1,0.1,0.2].forEach(v=>{ const y=lg(v); if(y<y0||y>y1) return;
    s+=`<line x1="${PL-4}" x2="${PL}" y1="${Y(y)}" y2="${Y(y)}" stroke="var(--faint)"/><text x="${PL-6}" y="${Y(y)+3.5}" text-anchor="end" font-size="11.5" fill="var(--muted)">${pct(v,0)}</text>`; });
  s+=`<text x="${(PL+W-PR)/2}" y="${H-4}" text-anchor="middle" font-size="12" fill="var(--muted)">vs its 5-year average → (compressed scale)</text>
    <text x="11" y="${(PT+bot)/2}" text-anchor="middle" font-size="12" fill="var(--muted)" transform="rotate(-90 11 ${(PT+bot)/2})">vs its 200-day average →</text>`;
  const dots=trails.map(tl=>[X(tl[tl.length-1][0]),Y(tl[tl.length-1][1])]);
  rows.forEach((r,i)=>{ const tl=trails[i].map(p=>[X(p[0]),Y(p[1])]), c=PHASE_COL(r.phase);
    s+=`<polyline points="${tl.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}" fill="none" stroke="${c}" stroke-opacity=".35" stroke-width="1.3"/>`;
    tl.slice(0,-1).forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="1.6" fill="${c}" fill-opacity=".4"/>`); });
  rows.forEach((r,i)=>{ const [x,y]=dots[i];
    s+=`<circle cx="${x}" cy="${y}" r="5.5" fill="${PHASE_COL(r.phase)}" stroke="var(--surface)" stroke-width="1.5" data-open="cyc:${esc(r.key)}" style="cursor:pointer"><title>${esc(`${r.name} (${regName(r)}): ${r.phase}. ${pct(r.vs5y,0)} vs its 5-year average, ${pct(r.vs200,0)} vs its 200-day average.`)}</title></circle>`; });
  // full names next to their dot, deepest dips first; an index left without room keeps its dot and hover text
  const pts=rows.map((r,i)=>({x:dots[i][0],y:dots[i][1],t:`${r.name} ${({uk:"UK",europe:"EU",us:"US"})[r.region]||""}`,key:r.key,dd:r.dd5}));
  placeLabels(pts.slice().sort((a,b)=>a.dd-b.dd),{box:{x0:PL+2,y0:PT+2,x1:W-PR-2,y1:bot-2},avoid:taken,far:true});
  s+=labelsSVG(pts,11.5,p=>`data-open="cyc:${esc(p.key)}" style="cursor:pointer"`);
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cycle clock">${s}</svg>`;
}

function cycleTestSection(T){
  if(!T) return `<section id="cyctest">${secHead({eyebrow:"Tested on the past",title:"Does buying the dip pay?"})}<p class="muted">The test needs more history.</p></section>`;
  const A=T.rules.dip, B=T.rules.turn, span=`${monthYear(T.from)} to ${monthYear(T.to)}`;
  const DEPTH_SHORT=["Within 10% of its high","10–20% below","20–30% below","30–50% below","Over 50% below"];
  const bars=(items,labels)=>barsSVG(items.map((r,i)=>({label:labels[i],v:r.edge})),{fmt:v=>pct(v,1)});
  const half=(h,i)=>`${i?"since":"up to"} ${monthYear(i?h.from:h.to)}: ${pct(h.edge,1)} a year (p = ${pval(h.p)})`;
  return `<section id="cyctest">${secHead({eyebrow:"Tested on the past",title:"Does buying the dip pay?",
      lead:`Every month-end from ${span}, in ${T.indices} of these indices: what happened over the next 12 months after each kind of moment, compared with buying the same index at any time. Fixed in advance and run once.`})}
    ${heroGrid([
      stat({label:"Buying deep dips",ico:"down",value:`${pct(A.edge,1)} <small class="of">a year</small>`,tone:A.edge>0?"pos":"neg",body:`<div>${vtag(A.verdict)}</div>`,
        sub:`Bought 30% or more below the 5-year high: ${A.episodes} separate dips. ${evidenceWord(A.verdict)}.`}),
      stat({label:"Waiting for the turn up",ico:"up",value:`${pct(B.edge,1)} <small class="of">a year</small>`,tone:B.edge>0?"pos":"neg",body:`<div>${vtag(B.verdict)}</div>`,
        sub:`Bought below the 5-year average once back above the 10-month average: ${B.episodes} separate times. ${evidenceWord(B.verdict)}.`}),
      stat({label:"Higher a year later",ico:"trend",value:pct(A.up,0,false),sub:`of deep-dip buys, against ${pct(A.upAll,0,false)} of all month-ends. They rose ${pct(A.avg,0)} on average, against ${pct(A.avgAll,0)}.`}),
      stat({label:"Fell further first",ico:"gauge",value:`1 in ${Math.max(1,Math.round(1/A.fellMore20))}`,sub:`deep-dip buys dropped another 20% or more before the year was out (worst: a further ${pct(Math.abs(A.worstLow),0,false)}).`})])}
    <div class="two" style="margin-top:14px">
      <div class="card chartbox"><div class="row"><span class="eyebrow">By how far below its 5-year high</span></div><div class="barwrap">${bars(T.depths,DEPTH_SHORT)}</div>
        <p class="note">Next 12 months against buying the same index at any time, after the fairness check. Deeper dips were followed by better years on average. Only the 30%+ rule was tested in advance; this split is shown for context.</p></div>
      <div class="card chartbox"><div class="row"><span class="eyebrow">By phase</span></div><div class="barwrap">${bars(T.phases,T.phases.map(p=>PHASE_SHORT[p.label]||p.label))}</div>
        <p class="note">The same, by phase. Waiting until a dipped index turned up did not help: its best years often began while it was still falling.</p></div></div>
    <div style="margin-top:10px">${more("cyctest-how",`<p><b>The rules</b> were fixed before the test ran: a <b>deep dip</b> is 30% or more below the highest month-end close of the past 5 years; <b>turning up</b> is below the 5-year average but above the 10-month average. Each was compared with buying the same index at any month-end, over the following 12 months.</p>
      <p><b>The fairness check:</b> comparing with an average that includes the dips themselves flatters dip-buying even when there is nothing to find (on made-up random prices it showed about +2% a year). So the real result was compared with 1,000 reshuffled histories, the same monthly moves in a random order. The figures shown are the real result minus the reshuffles' average, and "p" is the share of reshuffles that did at least as well: under 2.5% would be convincing, under 16% is some evidence. Here p = ${pval(A.p)} for buying deep dips and ${pval(B.p)} for waiting for the turn up.</p>
      <p><b>Deep dips in detail:</b> before the check, the next 12 months were ${pct(A.ex,1)} better than buying at any time. Over 3 years the check gives ${pct(A.edge3,1)} (p = ${pval(A.p3)}). Against simply buying the region's whole market at the same moment: ${pct(A.edgeMkt,1)} a year (p = ${pval(A.pMkt)}). In each half of the period: ${A.halves.map(half).join("; ")}, so the gain came mostly from the second half.</p>
      <p><b>Weaknesses:</b> dips bunch together in a few crises (1990–92, 2000–03, 2008–09, 2015–16, 2020, 2022), so ${A.episodes} dips are far fewer independent chances than they sound. The indices were picked today, knowing they are cyclical. They are price indices, so dividends are left out. And an index can't be bought directly: a fund charges a fee, and no fund tracks the UK FTSE 350 sector indices. Not advice.</p>`,"How the test worked, and its weaknesses")}</div></section>`;
}

/* ---------------------------------------------------------------- one index's detail panel */
const CTABS=[["cycle","Cycle"],["falls","Past falls"],["dips","Its dips"],["about","About & buying"]];
function cycleText(r){
  const fs=fallsOf(r), typ=medianOf(fs), worst=fs.length?Math.min(...fs):null, low=r.vs5y<0, up=r.vs200>0;
  const where=low? `${pct(Math.abs(r.vs5y),0,false)} below its 5-year average, so low in its recent cycle` : `${pct(r.vs5y,0,false)} above its 5-year average, so high in its recent cycle`;
  const dir=low? (up?"it has started to recover":"it is still falling") : (up?"it is still rising":"it has started to slip");
  let s=`${r.name} (${regName(r)}) is ${belowHigh(r.dd5)} (${dayStr(r.hi5At)}) and ${where}. It is ${up?"above":"below"} its 200-day average (${pct(r.vs200,0)}), so ${dir}.`;
  if(typ!=null) s+=` Its ${fs.length} big fall${fs.length>1?"s":""} since ${yearOf(r.since)} (${pct(r.swing,0,false)} or more) went ${fs.length>1?`a median ${pct(Math.abs(typ),0,false)} deep, the worst ${pct(Math.abs(worst),0,false)}`:`${pct(Math.abs(typ),0,false)} deep`}.`;
  if(isDeep(r)) s+=` At this depth it is in a deep dip: in our test, buying at such moments beat buying at any time over the next year on average, but about a quarter of those buys fell another 20% or more first.`;
  return s;
}
function openCycle(key){
  const C=S.cyc, r=C&&C.rows.find(x=>x.key===key); if(!r) return;
  S.sel=null; if(key!==S.csel||!CTABS.some(([k])=>k===S.ctab)) S.ctab="cycle"; S.csel=key;
  const tile=(l,v,c,tip="")=>`<div title="${esc(tip)}"><span>${l}</span><b class="${c==null?"":cls(c)}">${v}</b></div>`;
  const rangeBtn=(k,l)=>`<button type="button" data-crange="${k}" aria-pressed="${S.crange===k}">${l}</button>`;
  const fs=(r.falls||[]).slice().reverse(), o=r.own, n=r.now;
  const nowLine = !n? "" : n.kind==="fall"? `<p><b>Now:</b> ${pct(Math.abs(n.now),0,false)} below its peak of ${dayStr(n.from)} (${monthsWord(n.months)} ago). Its lowest point since was ${pct(Math.abs(n.low),0,false)} below, on ${dayStr(n.lowAt)}.</p>`
    : `<p><b>Now:</b> ${pct(n.now,0)} since its low of ${dayStr(n.from)} (${monthsWord(n.months)} ago)${n.now<n.high-0.02?`, having been up ${pct(n.high,0)} at its best on ${dayStr(n.highAt)}`:""}. No fall of ${pct(r.swing,0,false)} or more since then.</p>`;
  const ownCard=(k,title)=>{ const x=o&&o[k]; if(!x) return "";
    if(!x.months) return `<div class="card" style="padding:14px 16px"><div class="eyebrow">${title}</div><p style="margin:6px 0 0">Not once between ${monthYear(o.from)} and ${monthYear(o.to)}.</p></div>`;
    return `<div class="card" style="padding:14px 16px;display:grid;gap:10px"><div class="eyebrow">${title}</div>
      <div class="stats">${tile("Times",`${x.episodes} <small class="muted">(${x.months} month-ends)</small>`,null,"Separate dips: a run of consecutive month-ends counts once")}
        ${tile("Next 12 months, average",pct(x.avg,0),x.avg,`Against ${pct(o.avgAll,0)} from any month-end`)}
        ${tile("Higher a year later",pct(x.up,0,false),null,`Against ${pct(o.upAll,0,false)} from any month-end`)}
        ${tile("Worst further fall",pct(x.worstLow,0),x.worstLow,"The deepest it then fell within the year, at a month-end")}</div>
      <p class="note" style="margin:0">From any month-end: ${pct(o.avgAll,0)} on average, higher ${pct(o.upAll,0,false)} of the time. Latest one counted: ${monthYear(x.last)}.</p></div>`; };
  const buy = r.buy? `${r.region==="uk"?`<p style="margin:0">No fund tracks the FTSE 350 sector indices. The nearest fund:</p>`:""}${buyLineHTML(r.buy,r.full)}${r.buy.match==="similar"?`<p class="note" style="margin:0">Tracks ${esc(r.buy.differs)}.</p>`:""}${r.region==="uk"&&r.includes?`<p style="margin:0">Or buy its biggest companies' shares in London (${esc(r.includes)}), which IBKR sells.</p>`:""}`
    : r.region==="uk"? `<p style="margin:0">No fund tracks the FTSE 350 sector indices. Its companies are shares listed in London${r.includes?` (${esc(r.includes)})`:""}, which IBKR sells.</p>`
    : `<p style="margin:0">No UCITS fund tracks this index, so a UK investor can't buy one on IBKR. Its companies are US-listed shares${r.includes?` (${esc(r.includes)})`:""}, which IBKR sells.</p>`;
  const d=Drawer.open(r.name,`
    <div class="hd"><div><div class="eyebrow">${esc(regName(r))} · ${esc(r.full)}</div><h2>${esc(r.name)}</h2>
      <div class="muted" style="font-size:13px">${esc(r.what)}</div>
      <div style="margin-top:6px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px"><span class="num" style="font-size:18px">${lvl(r.level)}</span><span class="muted" style="font-size:12.5px">on ${dayStr(r.at)}</span>${phaseTag(r.phase)}${dipTag(r)}</div></div>
      <button class="btn close" type="button" id="closeD" aria-label="Close">Close ✕</button></div>
    ${dTabs(CTABS,S.ctab)}
    <div class="dgrid" data-pane="cycle">
      <div class="card" style="padding:16px;display:grid;gap:12px"><div class="eyebrow">Where it is now</div>${dipBar(r,true)}${dipLegend(true)}
        <p style="margin:0;font-size:15px">${esc(cycleText(r))}</p></div>
      <div class="stats">${[
        tile("From its 5-yr high",pct(r.dd5,0),r.dd5,`Its highest close of the past 5 years: ${lvl(r.hi5)} on ${dayStr(r.hi5At)}`),
        tile("From its 5-yr low",pct(r.level/r.lo5-1,0),1,`Its lowest close of the past 5 years: ${lvl(r.lo5)} on ${dayStr(r.lo5At)}`),
        tile("vs its 5-yr average",pct(r.vs5y,0),r.vs5y,"Below = low in its recent cycle; above = high"),
        tile("vs its 200-day avg",pct(r.vs200,0),r.vs200,"Above = rising lately; below = falling"),
        tile("1 week",pct(r.r1w,1),r.r1w),tile("3 months",pct(r.r3m,1),r.r3m),tile("1 year",pct(r.r1y,1),r.r1y),
        tile("Usual yearly swing",pct(r.swing,0,false),null,"How much it typically moves in a year (volatility); big falls are counted from this size up")].join("")}</div>
      <div class="card chartbox"><div class="row"><span class="eyebrow">Level</span><span class="key cr-ma"><i style="background:var(--warn)"></i>200-day average</span><span class="key cr-falls"><i style="background:color-mix(in oklab,var(--neg) 35%,transparent)"></i>Big falls</span>
        <span class="seg" role="group" aria-label="Range">${rangeBtn("1y","1 yr")}${rangeBtn("5y","5 yrs")}${rangeBtn("all","All")}</span></div>
        <div id="cchart"></div><p class="note" id="cnote"></p></div>
    </div>
    <div class="dgrid" data-pane="falls">
      <div class="card" style="padding:16px;display:grid;gap:8px"><div class="eyebrow">Big falls since ${yearOf(r.since)}</div>
        <p style="margin:0">Every fall of ${pct(r.swing,0,false)} or more from a peak to a bottom (about as much as it typically moves in a year), most recent first. A fall only counts as over once the index has climbed ${pct(r.swing*((S.cyc&&S.cyc.recover)||1.5),0,false)} from its low, so short rallies inside a long slump don't split it in two.</p>${nowLine}</div>
      ${fs.length?`<div class="tablebox"><table class="falls"><thead><tr><th>Peak</th><th>Bottom</th><th class="r">Fall</th><th class="r">Took</th><th class="r">Year after the bottom</th><th>Back to the peak</th></tr></thead><tbody>
        ${fs.map(f=>`<tr><td>${esc(dayStr(f.peak))}</td><td>${esc(dayStr(f.trough))}</td><td class="r num neg">${pct(f.fall,0)}</td><td class="r">${esc(monthsWord(f.months))}</td>
          <td class="r num ${cls(f.after1y)}">${f.after1y==null?"–":pct(f.after1y,0)}</td><td>${f.regained?esc(`${dayStr(f.regained)} (${monthsWord((f.regained-f.trough)/2629800)} after the bottom)`):'<span class="muted">Not yet</span>'}</td></tr>`).join("")}</tbody></table></div>`
        :'<p class="muted">No fall that big in its history here.</p>'}
      <p class="note">The bottom is only known afterwards: at the time, nobody could tell a fall had ended. Price index, so dividends are not included.</p>
    </div>
    <div class="dgrid" data-pane="dips">
      ${o?`${ownCard("dip","When 30% or more below its 5-year high")}${ownCard("turn","When below its 5-year average but turning up")}
        <p class="note">${esc(r.name)}'s own history from ${monthYear(o.from)} to ${monthYear(o.to)}, at month-ends; the record stops a year back, because each dip needs the 12 months after it. A handful of dips is too few to rely on: the test across all the indices (in the Cycles tab) is the better guide.</p>`
        :`<p class="muted">Not enough history yet: this needs 5 years of month-ends before the first dip can be measured, and a year after it.${r.note?` ${esc(r.note)}`:""}</p>`}
    </div>
    <div class="dgrid" data-pane="about">
      <dl class="card primer"><dt>What it is</dt><dd>${esc(r.what)}</dd>${r.includes?`<dt>Biggest companies</dt><dd>${esc(r.includes)}</dd>`:""}
        <dt>What drives its cycle</dt><dd>${esc(r.drives)}</dd><dt>History here</dt><dd>Since ${dayStr(r.since)}, daily closes from CNBC.${r.note?` ${esc(r.note)}`:""}</dd></dl>
      <div class="card buybox"><div class="eyebrow">Buying it on IBKR</div><p style="margin:0">You can't buy an index itself, only a fund that tracks it, or its companies' shares.</p>${buy}</div>
    </div>`,()=>{S.csel=null;});
  d.querySelectorAll("[data-crange]").forEach(bt=>bt.onclick=()=>{ S.crange=bt.dataset.crange; d.querySelectorAll("[data-crange]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.crange===S.crange)); drawCycleChart(r); });
  bindDTabs(d,S.ctab,k=>{ S.ctab=k; if(k==="cycle") drawCycleChart(r); });
}
function drawCycleChart(r){
  const el=$("#cchart"), note=$("#cnote"); if(!el) return;
  document.querySelectorAll("#drawer .cr-ma").forEach(k=>k.hidden=S.crange!=="1y");
  document.querySelectorAll("#drawer .cr-falls").forEach(k=>k.hidden=S.crange!=="all");
  if(S.crange==="1y"){ const R=r.recent, t=R.d.map(x=>R.t0+x*86400);
    lineChart(el,{t,series:[{v:R.c,color:"var(--ink)",name:"Level",w:1.8},{v:R.ma,color:"var(--warn)",name:"200-day avg",w:1.2}],fmt:lvl,area:1});
    note.textContent="Above a rising 200-day average (about 10 months) is the classic sign of an uptrend; below a falling one, of a downtrend."; return; }
  const L=longSeries(r);
  if(S.crange==="5y"){ const k=61, avg=r.level/(1+r.vs5y);
    lineChart(el,{t:L.t.slice(-k),series:[{v:L.c.slice(-k),color:"var(--ink)",name:"Level",w:1.6}],fmt:lvl,area:1,baseline:avg,baselineLabel:"5-year average"});
    note.textContent="Month-end levels. Below the dashed 5-year average = low in its recent cycle; above it = high."; return; }
  logChart(el,{t:L.t,c:L.c,falls:r.falls||[]});
  note.textContent=`Every month-end since ${yearOf(r.since)}, on a scale where equal percentage moves look the same size. Shaded: its big falls (${pct(r.swing,0,false)} or more).`;
}
/* month-end levels on a ratio scale, with the big falls shaded */
function logChart(el,{t,c,falls=[],h=260}){
  const W=Math.max(280,el.clientWidth||600), H=h, L=8, R=58, T=10, B=24, lv=c.map(v=>Math.log10(v));
  let mn=Math.min(...lv), mx=Math.max(...lv); const pad=(mx-mn)*.05||0.05; mn-=pad; mx+=pad;
  const t0=t[0], t1=t[t.length-1], X=ts=>L+(ts-t0)/(t1-t0)*(W-L-R), Y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  let ticks=[]; for(let k=Math.floor(mn);k<=Math.ceil(mx);k++) [1,2,5].forEach(m=>{ const v=k+Math.log10(m); if(v>=mn&&v<=mx) ticks.push(v); });
  if(ticks.length>6) ticks=ticks.filter(v=>Math.abs(v-Math.round(v))<1e-9||ticks.length<=6);
  let g=ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${W-R+6}" y="${Y(v)+4}" font-size="11" fill="var(--muted)" font-family="var(--mono)">${lvl(10**v)}</text>`).join("");
  const y0=yearOf(t0), y1=yearOf(t1), step=(y1-y0)>24?5:(y1-y0)>10?2:1;
  for(let y=Math.ceil(y0/step)*step;y<=y1;y+=step){ const ts=Date.UTC(y,0,1)/1000; if(ts<=t0) continue;
    g+=`<text x="${X(ts)}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="middle">${y}</text>`; }
  const sh=falls.map(f=>`<rect x="${X(f.peak)}" y="${T}" width="${Math.max(1,X(f.trough)-X(f.peak))}" height="${H-T-B}" fill="var(--neg)" fill-opacity=".10"><title>${esc(`${dayStr(f.peak)} to ${dayStr(f.trough)}: ${pct(f.fall,0)}`)}</title></rect>`).join("");
  const d=lv.map((v,i)=>(i?"L":"M")+X(t[i]).toFixed(1)+" "+Y(v).toFixed(1)).join(""), li=lv.length-1;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img">${sh}${g}
    <path d="${d}L${X(t[li])} ${H-B}L${X(t[0])} ${H-B}Z" fill="var(--ink)" fill-opacity=".05"/><path d="${d}" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="${X(t[li])}" cy="${Y(lv[li])}" r="3.5" fill="var(--ink)"/><rect x="${W-R+2}" y="${Y(lv[li])-9}" width="${R-4}" height="18" rx="4" fill="var(--ink)"/>
    <text x="${W-R+6}" y="${Y(lv[li])+4}" font-size="11" fill="var(--surface)" font-family="var(--mono)">${lvl(c[li])}</text>
    <line class="xh" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--muted)" visibility="hidden"/><rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/></svg>`;
  const svg=el.querySelector("svg"), xh=svg.querySelector(".xh"), tip=$("#tip");
  svg.addEventListener("mousemove",e=>{ const b=svg.getBoundingClientRect(), x=(e.clientX-b.left)*(W/b.width), ts=t0+(x-L)/(W-L-R)*(t1-t0);
    let i=t.findIndex(v=>v>=ts); if(i<0) i=li; xh.setAttribute("x1",X(t[i])); xh.setAttribute("x2",X(t[i])); xh.setAttribute("visibility","visible");
    tip.innerHTML=esc(new Date(t[i]*1000).toLocaleDateString(undefined,{month:"short",year:"numeric",timeZone:"UTC"}))+"  "+esc(lvl(c[i])); showTip(e); });
  svg.addEventListener("mouseleave",()=>{ xh.setAttribute("visibility","hidden"); tip.hidden=true; });
}

/* ---------------------------------------------------------------- data loop */
Views.init(["overview","rankings","maps","cycles","record","guide"],{
  maps:()=>S.data&&renderRRG(),
  cycles:()=>drawCycles(),
  record:()=>{ if(!S.data) return; drawBacktest(S.data.backtest); drawPaper(S.data.paper,S.pcur,true); }});
startLoop({url:"data", onData(data){
  const reopen=S.sel, scrollY=window.scrollY;
  data.rows.forEach(r=>{ r.m.top10 = r.holdings&&r.holdings.length ? r.holdings.reduce((a,x)=>a+x.pct,0) : null;
    const f=r.facts||{}, bf=(data.benches[r.group]||{}).facts||{};
    Object.assign(r.m,{aum:f.aumUsd??null, pe:f.pe??null, yld:f.yld??null, beta:f.beta??null, fee:f.fee??null,
      peRel: f.pe&&bf.pe ? f.pe/bf.pe-1 : null}); });
  S.data=data; render(); window.scrollTo(0,scrollY);
  if(reopen) openDetail(reopen);
}});
let rt; addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{ if(!S.data) return; Views.draw[Views.cur]?.();
  const r=S.sel&&S.data.rows.find(x=>x.symbol===S.sel); if(r) drawPane(r,S.dtab);
  const c=S.csel&&S.cyc&&S.cyc.rows.find(x=>x.key===S.csel); if(c&&S.ctab==="cycle") drawCycleChart(c); },200);});
</script>

name: Weekly briefing facts

# Early every Saturday: gather the week's numbers into briefings/facts/<date>.json and publish a
# factual draft. A scheduled Claude task then rewrites the draft in plain English (BRIEFING_PROMPT.md).
on:
  schedule:
    - cron: "30 6 * * 6"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  facts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Reuse fund data (holdings and facts, refreshed once a day)
        uses: actions/cache@v4
        with:
          path: fund_cache.json
          key: funddata-${{ github.run_id }}
          restore-keys: funddata-
      - run: python briefing.py
      - name: Save to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefings
          if git diff --cached --quiet; then echo "Nothing new to save"; exit 0; fi
          git commit -m "Weekly briefing facts $(date -u +%F)"
          git pull --rebase
          git push
      - name: Publish the site with the new draft
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ github.token }}

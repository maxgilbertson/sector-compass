name: Update prices and publish

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may run it a few minutes late)
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# A newer run replaces one still running or stuck in GitHub's queue, so a single stuck run can't hold up
# every later update (each run publishes the latest prices anyway, so nothing is lost).
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt
      - name: Reuse fund data (holdings and facts, refreshed once a day)
        uses: actions/cache@v4
        with:
          path: data/fund_cache.json
          key: funddata-${{ github.run_id }}
          restore-keys: funddata-
      - name: Reuse index history (cyclical indices, re-downloaded once a day; the dip test, re-run once a month)
        uses: actions/cache@v4
        with:
          path: |
            data/cycles_cache.json.gz
            data/cycles_test.json
          key: cycles-${{ github.run_id }}
          restore-keys: cycles-
      - run: python app/build_static.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

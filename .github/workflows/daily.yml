name: Daily snapshot

# After the US close each weekday: save every score, make the monthly practice-portfolio
# picks on the first run of a month, and commit them so the record is permanent.
on:
  schedule:
    - cron: "15 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt
      - name: Reuse fund data (holdings and facts, refreshed once a day)
        uses: actions/cache@v4
        with:
          path: data/fund_cache.json
          key: funddata-${{ github.run_id }}
          restore-keys: funddata-
      - run: python app/snapshot.py
      - name: Save to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history data/paper
          if git diff --cached --quiet; then echo "Nothing new to save"; exit 0; fi
          git commit -m "Daily snapshot $(date -u +%F)"
          git pull --rebase
          git push
      - name: Publish the site with the new data
        run: gh workflow run deploy.yml
        env:
          GH_TOKEN: ${{ github.token }}

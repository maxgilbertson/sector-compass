<main class="wrap" id="app"><div class="loading">Fetching live prices for 100+ sector funds across 7 regions…</div></main>
<div class="tip" id="tip" hidden></div>

<script src="common.js"></script>
<script>
"use strict";
/* ---------------------------------------------------------------- static knowledge */
const SECTORS = {
  tech:   {name:"Technology", kind:"Cyclical growth", what:"Software, computer chips, hardware and IT services.",
           drivers:"How much businesses spend on IT and cloud services, spending on AI data centres, the boom-and-bust cycle in chip demand, profit growth.",
           rates:"A lot. Their profits are expected far in the future, so when interest rates rise, investors pay less for them today.",
           risks:"Prices falling back from high levels, export restrictions, a pause in AI spending, reliance on a few big customers."},
  fin:    {name:"Financials", kind:"Cyclical value", what:"Banks, insurers, brokers, asset managers and stock exchanges.",
           drivers:"Lending growth, the gap between what banks earn on loans and pay on deposits (bigger when long-term rates are well above short-term ones), bad-debt levels, deal-making and trading.",
           rates:"Helped when long-term rates rise above short-term ones; hurt when a recession brings more unpaid loans.",
           risks:"Loan defaults, customers pulling deposits, stricter rules, falling rates squeezing lending profits."},
  health: {name:"Health Care", kind:"Defensive", what:"Drug makers, biotech, medical devices, health insurers and services.",
           drivers:"New drugs and approvals, patents running out, ageing populations, government pricing rules.",
           rates:"Little for big drug makers; a lot for biotech, which relies on raising money.",
           risks:"Rules on drug prices, failed drug trials, patents expiring, cuts to what governments pay."},
  energy: {name:"Energy", kind:"Cyclical / inflation hedge", what:"Oil and gas producers, refiners, pipelines and oilfield services.",
           drivers:"Oil and gas prices, OPEC+ production decisions, how carefully companies spend, dividends and buybacks.",
           rates:"Little. It tends to do well when prices across the economy are rising.",
           risks:"A slump in oil prices, falling demand, windfall taxes, the shift to cleaner energy."},
  indu:   {name:"Industrials", kind:"Cyclical", what:"Aerospace and defence, machinery, transport, construction and trading houses.",
           drivers:"Business investment, factory activity surveys, infrastructure and defence budgets, freight volumes.",
           rates:"Some. Higher borrowing costs slow big projects.",
           risks:"A factory slowdown, supply-chain problems, tariffs and trade disputes."},
  discr:  {name:"Consumer Discretionary", kind:"Cyclical", what:"Things people want but don't need: cars, shops, travel, leisure, homebuilders, online retail.",
           drivers:"How confident shoppers feel, wages after inflation, how easy it is to borrow, the housing market.",
           rates:"A lot. Big purchases like cars and homes are often bought on credit.",
           risks:"Shoppers cutting back, rising unemployment, tariffs on imported goods."},
  staples:{name:"Consumer Staples", kind:"Defensive", what:"Everyday essentials: food, drinks, household and personal products, supermarkets.",
           drivers:"Steady demand, the ability to raise prices, ingredient and packaging costs, sales in emerging markets.",
           rates:"Some. Investors often treat them like bonds because of their steady dividends.",
           risks:"Rising costs, cheaper own-brand competition, weight-loss drugs reducing food sales."},
  util:   {name:"Utilities", kind:"Defensive / bond-like", what:"Electricity, gas and water companies and power producers.",
           drivers:"Profits set by regulators, electricity demand (including data centres), how much they spend on new plants and grids.",
           rates:"A lot. When interest rates rise, their dividends look less attractive next to safer bonds.",
           risks:"Rising interest rates, regulators' decisions, wildfire and storm damage claims."},
  mat:    {name:"Materials", kind:"Cyclical / commodity", what:"Chemicals, metals and mining, steel, building materials and gold miners.",
           drivers:"Commodity prices, demand from China, the US dollar, global factory output.",
           rates:"Little to some. A weaker dollar usually helps.",
           risks:"A China slowdown, too much supply, energy costs for European chemical makers."},
  re:     {name:"Real Estate", kind:"Rate-sensitive income", what:"Property companies and REITs (funds that own buildings): offices, warehouses, homes, data centres.",
           drivers:"How full buildings are, rents, property values, borrowing costs.",
           rates:"A lot. Property values usually fall when long-term interest rates rise.",
           risks:"Loans that must be refinanced at higher rates, empty offices, falling property values."},
  comm:   {name:"Communication Services", kind:"Mixed growth / defensive", what:"Telecoms, media, and online platforms such as search and social media.",
           drivers:"Advertising spending, subscriber growth, the cost of content, spending on mobile and fibre networks.",
           rates:"Some. Telecoms behave like bonds; online platforms behave like tech.",
           risks:"Advertising slumps, competition cases against big platforms, heavy network spending."},
  country:{name:"Country fund", kind:"Broad market", what:"A whole national stock market in one fund, with all sectors mixed together.",
           drivers:"The country's economic growth, its central bank's interest rates, its currency, which sectors dominate its stock market.",
           rates:"Depends on the country; returns are in US dollars, so currency moves count.",
           risks:"Political and policy changes, currency swings, a few big companies dominating. See the Countries page for the full picture."},
};
const PHASE_COLORS = {"Early cycle":"var(--info)","Mid cycle":"var(--pos)","Late cycle":"var(--warn)","Contraction":"var(--neg)"};
const PHASE_PLAIN = {"Early cycle":"recovery","Mid cycle":"steady growth","Late cycle":"late expansion","Contraction":"recession"};
const phaseMix = cyc => cyc.phases.length>1? `a mix of ${cyc.phases.map(p=>PHASE_PLAIN[p]).join(" and ")}` : PHASE_PLAIN[cyc.phases[0]];
const MACRO_HINT = {
  "^VIX":"How big a swing investors expect in US shares over the next month. Under 16 = calm, over 25 = stressed. Spikes tend to favour steadier sectors like food, utilities and health care.",
  "^TNX":"What the US government pays to borrow for 10 years. When it rises, tech, utility and property shares usually suffer.",
  "CURVE":"How much more the US government pays to borrow for 10 years than for 3 months. Below zero ('inverted') has come before most US recessions.",
  "DX-Y.NYB":"The dollar against the euro, yen, pound and others; watch the direction. A strong dollar hurts US companies that sell abroad, commodities and emerging markets.",
  "CL=F":"Drives energy shares; a cost for airlines and chemical makers.",
  "GC=F":"Bought as a safe haven in worrying times.",
  "HG=F":"Copper goes into almost everything that gets built, so its price is a rough gauge of industrial demand.",
  "BTC-USD":"A gauge of how much risk investors are willing to take.",
};
const COLS = [
  {k:"r1d",l:"Today",cap:.02,tip:"Return today (or on the last trading day), including dividends"},
  {k:"r1w",l:"Week",cap:.04,tip:"Return over the last 5 trading days"},
  {k:"r1m",l:"1 mo",cap:.08,tip:"Return over the last month"},
  {k:"r3m",l:"3 mo",cap:.15,tip:"Return over the last 3 months"},
  {k:"ytd",l:"Since Jan 1",cap:.3,tip:"Return since 1 January"},
  {k:"r1y",l:"1 yr",cap:.4,tip:"Return over the last year"},
  {k:"r3y",l:"3 yr avg",cap:.2,tip:"Average yearly return over the last 3 years"},
];

/* ---------------------------------------------------------------- state */
const store = makeStore("sc.");
const S = {data:null, region:store.get("region","all"), q:"", sort:store.get("sort",{k:"score",dir:-1}),
           rrg:store.get("rrg","us"), sel:null, range:"1y"};
const grp = id => (S.data.groups.find(g=>g.id===id)||{});
const groupName = id => grp(id).name||id;
const groupShort = id => ({us:"US",global:"Global",europe:"Europe",japan:"Japan",canada:"Canada",themes:"Theme",countries:"Country"})[id]||id;
// what each fund is compared with, in plain words ("the whole US market (S&P 500)") and short ("S&P 500")
const benchPlain = id => grp(id).plain||"its region's whole market";
const benchShort = id => grp(id).short||"the whole market";
const REGION_MKT = "the whole stock market of its region";
function vsListText(){ // "US sectors and themes vs the S&P 500, ..." built from the data so it stays in sync with universe.py
  const g=id=>grp(id).bench_name;
  return `US sectors and themes vs the ${g("us")}, European vs the ${g("europe")}, Japanese vs ${g("japan")}, Canadian vs the ${g("canada")}, and global and country funds vs all world stocks (${g("global")})`;
}

/* ---------------------------------------------------------------- narrative */
function narrative(r){
  const m=r.m, bp=benchPlain(r.group), bench=S.data.benches[r.group]||{}, out=[], sign=CCY_SIGN[r.ccy]||"";
  if(m.r1y!=null){
    let s=`${m.r1y>=0?"Up":"Down"} ${pct(Math.abs(m.r1y),1,false)} over the past year.`;
    if(m.rs1y!=null){ const br=m.r1y-m.rs1y, shown=(+(m.r1y*100).toFixed(1) - +(br*100).toFixed(1))/100;
      s+=` ${bp[0].toUpperCase()+bp.slice(1)} ${br>=0?"rose":"fell"} ${pct(Math.abs(br),1,false)}, so this did ${betterWorse(shown)}.`;
      if(sign) s+=` ${sign}1,000 put in a year ago would now be about ${sign}${Math.round(1000*(1+m.r1y)).toLocaleString()}, against ${sign}${Math.round(1000*(1+br)).toLocaleString()} in ${benchShort(r.group)==="world stocks"?"world stocks":"the "+benchShort(r.group)}.`; }
    out.push(s);
  }
  out.push(m.trend===4?"Clear uptrend: the price is above its average over the last 50 trading days (about 2½ months) and 200 trading days (about 10 months), and the 10-month average is rising."
    : m.trend===0?"Clear downtrend: the price is below both its 50-day and 200-day averages, and the 200-day average is falling."
    : m.vs200>0?`Mixed trend: it passes ${m.trend} of 4 uptrend checks, and is still above its 200-day (about 10-month) average price.`
    : `Mixed trend: it passes ${m.trend} of 4 uptrend checks, and is below its 200-day (about 10-month) average price, so the long-term trend is not yet repaired.`);
  const qs=quadSentence(m.quad,bp); if(qs) out.push(`Rotation (${m.quad}): ${qs}`);
  const ht=historyText(m,false); if(ht) out.push("Score changes (out of 100): "+ht);
  const bf=bench.facts||{};
  if(m.pe!=null&&bf.pe) out.push(`Price vs profits: buyers pay ${m.pe.toFixed(1)} times the last year's profits here (P/E), against ${bf.pe.toFixed(1)} for ${bp}, `+
    (Math.abs(m.peRel)<0.05?"about the same."
     :`so it is ${pct(Math.abs(m.peRel),0,false)} ${m.peRel>0?"pricier":"cheaper"}.`+
      (m.peRel>0.25?" Investors are paying up for expected growth, so disappointments can hurt."
       :m.peRel<-0.2?" Often cheap for a reason, but low expectations can cushion bad news.":"")));
  if(m.vol!=null){ const bv=(bench.m||{}).vol;
    out.push(`Risk: over the last 3 months its volatility (a measure of typical daily ups and downs, scaled to a year; higher = bumpier) was ${pct(m.vol,0,false)}${bv?`, against ${pct(bv,0,false)} for the ${benchShort(r.group)}`:""}. `+
      `Its biggest drop in the past year was ${pct(Math.abs(m.mdd),1,false)}, and ${m.offHigh>-0.005?"it is at or very near its highest price of the past year":`it is now ${pct(Math.abs(m.offHigh),1,false)} below its highest price of the past year`}.`); }
  if(m.rsi!=null){ if(m.rsi>=70) out.push(`Timing: its recent gains have been much bigger than its recent losses (RSI ${m.rsi.toFixed(0)}; 70 or more is called 'overbought'). Buying right after a sharp run-up carries the risk of a short-term dip.`);
    else if(m.rsi<=30) out.push(`Timing: its recent losses have been much bigger than its recent gains (RSI ${m.rsi.toFixed(0)}; 30 or under is called 'oversold'). Short bounces are common, but it can keep falling, so wait for the trend to turn.`);
    else out.push(`Timing: RSI ${m.rsi.toFixed(0)}: it has not risen or fallen unusually fast lately.`); }
  const cyc=S.data.cycle, fav=cyc.favoured, phase=phaseMix(cyc);
  if(r.key!=="country") out.push(fav.includes(r.key) ? `Economic cycle: our US market signals point to ${phase} (see the top of the page), and this sector has tended to do well then.`
                                                    : `Economic cycle: our US market signals point to ${phase} (see the top of the page), when this sector has not usually led.`);
  return out;
}
function reasonShort(r){
  const m=r.m, bits=[];
  if(m.rs1y!=null) bits.push(`${aheadBehind(m.rs1y,0)} ${relPrep(m.rs1y)}${benchShort(r.group)==="world stocks"?"world stocks":"the "+benchShort(r.group)} over the past year`);
  bits.push(TREND_WORD[m.trend]);
  if(m.quad) bits.push(QUAD_PLAIN[m.quad]);
  if(m.d1w!=null&&Math.abs(m.d1w)>=1) bits.push(`score ${m.d1w>0?"up":"down"} ${Math.round(Math.abs(m.d1w))} this week`);
  if(m.rsi>=70) bits.push("rose fast recently"); if(m.rsi<=30) bits.push("fell fast recently");
  return bits.join(" · ");
}

/* ---------------------------------------------------------------- render: page */
function filtered(){
  const q=S.q.trim().toLowerCase();
  return S.data.rows.filter(r=>(S.region==="all"||r.group===S.region) &&
    (!q || (r.name+" "+r.symbol+" "+r.fund+" "+groupName(r.group)+" "+(SECTORS[r.key]||{}).name).toLowerCase().includes(q) || holdingMatch(r)));
}
function sorted(rows){
  const {k,dir}=S.sort, get = r => k==="name"?r.name : k==="quad"?["Lagging","Improving","Weakening","Leading"].indexOf(r.m.quad) : r.m[k];
  return rows.slice().sort((a,b)=>{ const x=get(a), y=get(b); if(x==null) return 1; if(y==null) return -1;
    return (typeof x==="string"? x.localeCompare(y) : x-y)*dir; });
}

function render(){
  const D=S.data, app=$("#app");
  const cyc=D.cycle, fav=cyc.favoured, n=D.rows.length;
  app.innerHTML = `
  <section>
    <div class="card howto"><div class="eyebrow">How to read this page</div>
      <p>Each sector fund is compared with <b>the whole stock market of its own region</b>. For example, US Technology is compared with the S&amp;P 500, the 500 biggest US companies across every sector. "Ahead" means the sector did better than simply owning that whole market; "behind" means it did worse.</p>
      <p>Each fund also gets a <b>score from 0 to 100</b> that ranks it against the other ${n-1}: 50 is the middle, 60 or more is favoured, under 40 is weak. Everything is based on past prices, so it describes what has been happening, not what will happen.</p></div>
  </section>

  <section>
    <div class="sec-head"><div class="grow"><div class="eyebrow">Economic backdrop</div><h2>Where is the economy in its cycle?</h2>
      <p>Economies move through phases: recovery, steady growth, late expansion and recession. This is an automatic read of US market signals: the gap between long- and short-term interest rates, oil, copper against gold, how nervous investors are, and the US stock market's trend. Different sectors have tended to do best in different phases.</p></div></div>
    <div class="backdrop">
      <div class="card cycle">
        <div><div class="eyebrow">Current read</div><div class="phase" style="color:${PHASE_COLORS[cyc.primary]}">${esc(cyc.phase)}</div>
          <div class="muted" style="font-size:14px;margin-top:4px">${esc(phaseMix(cyc).replace(/^./,c=>c.toUpperCase()))}</div></div>
        <div class="muted" style="font-size:12.5px">How the evidence below is weighted between the four phases:</div>
        <div class="phasebar">${Object.entries(cyc.weights).map(([k,v])=>`<i style="width:${v*100}%;background:${PHASE_COLORS[k]}" title="${esc(k)}: ${Math.round(v*100)}% of the weighted evidence"></i>`).join("")}</div>
        <div class="phaselegend">${Object.entries(cyc.weights).map(([k,v])=>`<span><i class="sw" style="background:${PHASE_COLORS[k]}"></i>${esc(k.replace(" cycle",""))} (${esc(PHASE_PLAIN[k])}) <b>${Math.round(v*100)}%</b></span>`).join("")}</div>
        <ul>${cyc.notes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
        <div><div class="eyebrow" style="margin-bottom:6px">Sectors that have usually done well in this phase</div>
          <div class="chips">${fav.map(k=>`<span class="chip" title="${esc(SECTORS[k].what)}">${esc(SECTORS[k].name)}</span>`).join("")}</div></div>
      </div>
      <div class="macro">${macroTiles()}</div>
    </div>
  </section>

  <section>
    <div class="sec-head"><div class="grow"><div class="eyebrow">Shortlist</div><h2>What the data favours today</h2>
      <p>Picked from all ${n} funds using the 0–100 score, which combines how each fund has done against the whole stock market of its region (over 3, 6 and 12 months), how healthy its price trend is, its gain for the risk taken, and the size of its biggest recent drop. Read the <a href="#limits">limitations</a> before acting on it.</p>
      ${btSummaryLine(D.backtest,{noun:"funds",vs:"the whole stock market of their own region"})}</div></div>
    <div class="ideas">${ideas()}</div>
  </section>

  <section class="two">
    <div class="card panel rrgbox">
      <div class="sec-head"><div class="grow"><div class="eyebrow">Rotation map</div><h3>Who is gaining on the market?</h3>
        <p style="font-size:13px" id="rrgcap"></p></div>
        <select id="rrgsel" class="btn" aria-label="Region for rotation map">${D.groups.map(g=>`<option value="${g.id}" ${S.rrg===g.id?"selected":""}>${esc(g.name)}</option>`).join("")}</select></div>
      <div id="rrg"></div>
    </div>
    <div class="card panel">
      <div class="sec-head"><div class="grow"><div class="eyebrow">Across regions</div><h3>Same sector, different region</h3>
        <p style="font-size:13px">Average score (0–100) of each sector's funds in each region: green = strong, red = weak. Each fund is judged against its own region's whole stock market, so this shows where a sector is strong within its region; it doesn't directly compare one region's returns with another's. Click a cell to open its best fund.</p></div></div>
      <div style="overflow-x:auto">${matrix()}</div>
    </div>
  </section>

  <section id="ranking">
    <div class="sec-head"><div class="grow"><div class="eyebrow">Full ranking</div><h2>Every sector, scored</h2>
      <p>Click any row for the full breakdown, chart and reasoning. Click a column header to sort. Returns include dividends and are in each fund's own currency (dollars for US funds, euros for European, yen for Japanese, Canadian dollars for Canadian).</p></div>
      <div class="controls">
        <div class="tabs" role="group" aria-label="Region">${[["all","All"],...D.groups.map(g=>[g.id,groupShort(g.id)])].map(([id,l])=>
          `<button class="tab" type="button" data-region="${id}" aria-pressed="${S.region===id}">${esc(l==="Theme"?"Themes":l==="Country"?"Countries":l)}</button>`).join("")}</div>
        <input class="search" id="search" type="search" placeholder="Search sector, ticker or company (e.g. Nvidia)" value="${esc(S.q)}" aria-label="Search">
      </div></div>
    <div class="tablebox" id="tablebox"></div>
    <div class="glossary">
      <div><b>Score (0–100)</b> ranks each fund against all ${n}. 50 = middle; 60+ = favoured (Overweight: hold more than usual); under 40 = weak (Underweight or Avoid).</div>
      <div><b>vs whole mkt, 6 mo</b> how far ahead (+) or behind (−) the whole stock market of its own region over 6 months: ${esc(vsListText())}.</div>
      <div><b>Score chg (wk)</b> how much the score moved this week.</div>
      <div><b>Trend</b> 4 uptrend checks: price above its 50-day average · above its 200-day average · 50-day above 200-day · 200-day rising. 4 bars = clear uptrend.</div>
      <div><b>Heat (RSI)</b> compares the size of recent gains with recent losses (last 14 trading days). 70 or more (amber) = sharp run-up, which can pause; 30 or under (blue) = sharp fall, which can bounce.</div>
      <div><b>Swings</b> volatility: how bumpy the price has been over the last 3 months, scaled to a year. Higher = bigger ups and downs.</div>
      <div><b>P/E</b> what buyers pay for each $1 of yearly profits. Amber = over 25% pricier than its region's market; blue = over 20% cheaper.</div>
      <div><b>Rotation</b> vs its region's whole market over roughly the last two months (so it can differ from the 6-month and 1-year figures): <span class="q q-Leading">Leading</span> = ahead and pulling away · <span class="q q-Weakening">Weakening</span> = ahead but its edge is fading · <span class="q q-Lagging">Lagging</span> = behind and slipping · <span class="q q-Improving">Improving</span> = behind but improving.</div>
      <div><b class="fit">✓</b> this sector has usually done well in the economy's current phase (see the top of the page).</div>
    </div>
  </section>

  ${backtestSection(D.backtest,{noun:"funds",one:"fund",vs:"the whole stock market of their own region",vsShort:"their region's whole market",vsList:vsListText()})}

  <section>
    <div class="sec-head"><div class="grow"><div class="eyebrow">Method</div><h2>How to use this</h2></div></div>
    <div class="method">
      <div class="card"><h3>The score</h3><p>Each fund gets a 0–100 rank on six measures (100 = best of all ${n} funds), and the ranks are combined with these weights:</p>
        <ul>${Object.entries(D.weights).map(([k,w])=>`<li title="${esc(partTip(k,"its region's whole market"))}">${esc(partName(k,"its region's whole market"))}: ${Math.round(w*100)}%</li>`).join("")}</ul>
        <p>What each fund is compared with: ${esc(vsListText())}. That way a sector doesn't look good just because its whole market went up.</p></div>
      <div class="card"><h3>Reading the signals</h3><ul>
        <li><b>Strong overweight</b> (80+) / <b>Overweight</b> (60–79): usually doing better than its region's whole market with a healthy trend; a case for holding more of it than its usual share.</li>
        <li><b>Neutral</b> (40–59): no clear lean either way; a normal amount.</li>
        <li><b>Underweight</b> (20–39) / <b>Avoid</b> (under 20): usually behind its region's whole market with a weak trend; a case for holding less, or none.</li>
        <li><b>Score chg (wk)</b> shows whether a score is rising or fading. A rising score often comes before a better signal.</li>
        <li><b>Improving</b> on the rotation map flags funds catching up before the score does.</li>
        <li><b>Rose fast</b> flags suggest waiting for a dip, even for strong sectors.</li></ul></div>
      <div class="card"><h3>What updates, and when</h3>
        <p><b>With every price update</b> (${STATIC?"about every 15–30 minutes":"every 5 minutes"}): returns, trend, heat, swings, every score and signal, score changes and history, flags, the rotation map, the economic read, the shortlists and every written verdict. Scores use the latest trade price. Open pages pick up new data by themselves.</p>
        <p><b>Once a month:</b> the track record test adds the month just finished.</p>
        <p><b>Once a day:</b> top-10 holdings, fund size, P/E, dividend yield, beta and fees.</p>
        <p><b>Fixed:</b> the sector descriptions and which sectors suit which economic phase.</p>
        <p class="muted" style="font-size:12.5px">${n} funds${D.errors.length?` · unavailable: ${esc(D.errors.join(", "))}`:""}</p></div>
    </div>
  </section>

  <section id="limits">
    <div class="sec-head"><div class="grow"><div class="eyebrow">Read before relying on it</div><h2>Limitations</h2>
      <p>This is a screening tool that summarises price behaviour. It is not a forecast, and it should be one input among several.</p></div></div>
    <div class="method">
      <div class="card"><h3>The data</h3><ul>
        <li>Prices come from Yahoo Finance's free, unofficial feed. They can be about 15 minutes late, and the feed can have gaps, errors or stop working without notice.</li>
        <li>Yahoo's history occasionally contains wrong prices (for example, TOPIX at a tenth of its value for two days in March 2026). Short glitches that snap back are filtered out; longer ones could still slip through.</li>
        <li>The website depends on GitHub's scheduler, which can run late. The status line at the top turns amber ("Delayed") if data is more than an hour old.</li>
        <li>Each region only moves while its stock exchange is open, so Japan, Europe and North America update at different times of day.</li>
        <li>Fund facts (P/E, dividend yield, beta, fees, fund size) are Yahoo's figures and can lag or differ from the fund provider's own. Yahoo has no fee figure for the Japanese TOPIX-17 funds.</li>

        <li>${!D.backtest?"The score has not been tested on past data yet.":btStrength(D.backtest).cls==="good"?"Tested on past data, high-scoring funds went on to do clearly better than low-scoring ones, but not in every month.":btStrength(D.backtest).cls==="weak"?"Tested on past data, high-scoring funds did better than low-scoring ones on average, but the results swung so much from month to month that this could still be luck.":"Tested on past data, high-scoring funds did not reliably do better than low-scoring ones."} The test also only includes funds picked in 2026, with hindsight. See <a href="#track">the track record</a>.</li>
        <li>Scores rank funds against each other, so a fund's score can change because other funds moved.</li>
        <li>The economic read uses a handful of US market signals and simple rules, and applies them to every region. Which sectors "suit" each phase is a historical tendency, not a rule.</li>
        <li>The rotation map is a simplified version of a method called Relative Rotation Graphs, not the licensed original.</li></ul></div>

        <li>Fund sizes are converted to US dollars at today's exchange rate.</li>

    </div>
    <p class="disclaimer">For research and education only. This is not personalised investment advice. Check a fund's costs, holdings, risks and suitability for you before investing, and consider speaking to a licensed adviser.</p>
  </section>`;

  renderTable(); renderRRG(); drawBacktest(D.backtest,{baselineLabel:"Market = $100"});
  app.querySelectorAll("[data-region]").forEach(b=>b.onclick=()=>{S.region=b.dataset.region;store.set("region",S.region);

}

function macroTiles(){
  const M=S.data.macro, order=["^VIX","^TNX","CURVE","DX-Y.NYB","CL=F","GC=F","HG=F","BTC-USD"];
  const DOLLAR=new Set(["CL=F","GC=F","HG=F","BTC-USD"]);
  const before=(m,dp,u="")=>`prev close ${(m.price/(1+m.r1d)).toFixed(dp)}${u} · 3 mo ago ${(m.price/(1+m.r3m)).toFixed(dp)}${u}`;
  return order.map(sym=>{
    if(sym==="CURVE"){ const a=M["^TNX"], b=M["^IRX"]; if(!a||!b) return "";
      const v=a.price-b.price; return `<div class="tile"><span class="lab">Yield curve (long minus short rates)</span><span class="val ${v<0?"neg":""}">${v>0?"+":""}${v.toFixed(2)}%</span>
        <span class="chg"><span class="muted">10-yr ${a.price.toFixed(2)}% vs 3-mo ${b.price.toFixed(2)}%</span></span><span class="hint">${MACRO_HINT.CURVE}</span></div>`; }
    const m=M[sym]; if(!m) return "";
    const val = sym==="^TNX"? m.price.toFixed(2)+"%" : (DOLLAR.has(sym)?"$":"")+money(m.price);
    const chg = sym==="^TNX"? `<span class="muted">${before(m,2,"%")}</span>`
              : sym==="^VIX"? `<span class="muted">${before(m,1)}</span>`
              : `<span class="${cls(m.r1d)}">Today ${pct(m.r1d)}</span><span class="${cls(m.r3m)}">3 mo ${pct(m.r3m)}</span>`;
    const up = sym==="^VIX"||sym==="^TNX" ? "var(--warn)" : null;
    return `<div class="tile"><span class="lab">${esc(m.label)}</span><span class="val">${val}</span>
      <span class="chg">${chg}</span>
      ${sparkSVG(m.spark,{w:200,h:30,color:up})}<span class="hint">${esc(MACRO_HINT[sym]||"")} Chart: last 6 months.</span></div>`;
  }).join("");
}

function ideas(){
  const rows=S.data.rows.filter(r=>r.m.score!=null);
  const lead = rows.slice().sort((a,b)=>b.m.score-a.m.score).slice(0,6);
  const turn = rows.filter(r=>r.m.quad==="Improving" && r.m.rrg && r.m.rrg.length>1)
    .map(r=>({r,mom:r.m.rrg[r.m.rrg.length-1][1]-r.m.rrg[0][1]+(r.m.trend*0.5)+((r.m.d1m||0)/10)}))
    .sort((a,b)=>b.mom-a.mom).slice(0,6).map(x=>x.r);
  const avoid = rows.slice().sort((a,b)=>a.m.score-b.m.score).slice(0,6);
  const col=(title,color,desc,list)=>`<div class="card idea-col"><h3><i class="sw" style="background:${color}"></i>${title}</h3><p>${desc}</p>${list.map(ideaRow).join("")||'<p class="muted">Nothing qualifies right now.</p>'}</div>`;
  return col("Leaders","var(--pos)","Highest scores: prices rising and doing better than the whole stock market of their region.",lead)+
         col("Turnaround watch","var(--info)","Behind their region's whole market lately, but improving. Wait until the price trend turns up too.",turn)+
         col("Weakest: avoid for now","var(--neg)","Lowest scores: they rank poorly on performance against their region's whole market, trend and risk.",avoid);
}

function matrix(){
  const regs=["us","global","europe","japan","canada","themes"], keys=Object.keys(SECTORS).filter(k=>k!=="country");
  const fav=S.data.cycle.favoured;
  const cell=(k,g)=>{ const rs=S.data.rows.filter(r=>r.key===k&&r.group===g&&r.m.score!=null);
    if(!rs.length) return `<td class="cell empty" title="No fund for this sector here">·</td>`;
    const avg=rs.reduce((a,r)=>a+r.m.score,0)/rs.length, best=rs.slice().sort((a,b)=>b.m.score-a.m.score)[0];
    const t=(avg-50)/50, bg=`color-mix(in oklab,var(${t>0?"--pos":"--neg"}) ${Math.round(Math.abs(t)*55)}%,transparent)`;
    return `<td class="cell" style="background:${bg}" data-open="${esc(best.symbol)}" title="${esc(rs.map(r=>r.name+" "+Math.round(r.m.score)).join(", "))}">${Math.round(avg)}</td>`; };
  return `<table class="matrix"><thead><tr><th class="l"></th>${regs.map(g=>`<th title="${esc("Compared with "+benchPlain(g))}">${esc(g==="themes"?"Themes (US-listed)":groupShort(g))}</th>`).join("")}</tr></thead>
    <tbody>${keys.map(k=>`<tr><td class="l" title="${esc(SECTORS[k].what)}">${esc(SECTORS[k].name)}${fav.includes(k)?' <span class="fit" title="Has usually done well in the economy\'s current phase">✓</span>':""}</td>${regs.map(g=>cell(k,g)).join("")}</tr>`).join("")}</tbody></table>`;
}

}
function drawCharts(r){
  const m=r.m; drawPrice(r); drawScoreHistory(m,S.data.histCuts);
  if(m.relSeries) lineChart($("#rchart"),{t:m.series.t.slice(-m.relSeries.length),series:[{v:m.relSeries,color:"var(--accent)",name:"vs "+benchShort(r.group)}],h:170,baseline:100,fmt:v=>pct(v/100-1,1)});
}
function holdingMatch(r){
  const q=S.q.trim().toLowerCase(); if(!q||!r.holdings) return null;
  return r.holdings.find(x=>x.name.toLowerCase().includes(q)||x.sym.toLowerCase()===q) || null;
}
function drawPrice(r){
  const m=r.m, dp=m.price>=100?0:2;
  document.querySelectorAll("#drawer .key.ma").forEach(k=>k.hidden=S.range!=="1y");
  if(S.range==="1y") return lineChart($("#pchart"),{t:m.series.t,series:[{v:m.series.c,color:"var(--ink)",name:"Price",w:1.8},{v:m.ma50,color:"var(--accent)",name:"50-day avg",w:1.2},{v:m.ma200,color:"var(--warn)",name:"200-day avg",w:1.2}],fmt:v=>v.toFixed(dp),area:1});
  const k=S.range==="5y"?252:m.long.t.length;
  lineChart($("#pchart"),{t:m.long.t.slice(-k),series:[{v:m.long.c.slice(-k),color:"var(--ink)",name:"Price",w:1.6}],fmt:v=>v.toFixed(dp),area:1});
}

/* ---------------------------------------------------------------- data loop */
startLoop({url:"data", onData(data){
  const reopen=S.sel, scrollY=window.scrollY;
  data.rows.forEach(r=>{ r.m.top10 = r.holdings&&r.holdings.length ? r.holdings.reduce((a,x)=>a+x.pct,0) : null;
    const f=r.facts||{}, bf=(data.benches[r.group]||{}).facts||{};
    Object.assign(r.m,{aum:f.aumUsd??null, pe:f.pe??null, yld:f.yld??null, beta:f.beta??null, fee:f.fee??null,
      peRel: f.pe&&bf.pe ? f.pe/bf.pe-1 : null}); });
  S.data=data; render(); window.scrollTo(0,scrollY);
  if(reopen) openDetail(reopen);
}});
let rt; addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{ if(!S.data) return; renderRRG(); drawBacktest(S.data.backtest);
  const r=S.sel&&S.data.rows.find(x=>x.symbol===S.sel); if(r) drawCharts(r); },200);});
</script>

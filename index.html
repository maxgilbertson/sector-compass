<script>
"use strict";
/* ---------------------------------------------------------------- static knowledge */
const SECTORS = {
  tech:   {name:"Technology", kind:"Cyclical growth", what:"Software, semiconductors, hardware and IT services.",
           drivers:"Enterprise IT and cloud budgets, AI infrastructure spending, the semiconductor inventory cycle, earnings growth.",
           rates:"High. Profits sit far in the future, so rising bond yields cut what investors will pay for them.",
           risks:"Valuation de-rating, export controls, a pause in AI capex, customer concentration."},
  fin:    {name:"Financials", kind:"Cyclical value", what:"Banks, insurers, brokers, asset managers and exchanges.",
           drivers:"Loan growth, net interest margin (a steeper yield curve helps), credit quality, deal and trading activity.",
           rates:"Positive when the curve steepens; hurt when recession lifts loan losses.",
           risks:"Credit defaults, deposit flight, tighter capital rules, falling rates squeezing margins."},
  health: {name:"Health Care", kind:"Defensive", what:"Pharma, biotech, medical devices, insurers and services.",
           drivers:"Drug pipelines and approvals, patent expiries, ageing populations, government pricing policy.",
           rates:"Low for pharma; high for biotech, which relies on funding markets.",
           risks:"Drug-price regulation, failed trials, patent cliffs, reimbursement cuts."},
  energy: {name:"Energy", kind:"Cyclical / inflation hedge", what:"Oil and gas producers, refiners, pipelines and oilfield services.",
           drivers:"Crude and natural gas prices, OPEC+ supply decisions, capital discipline, shareholder payouts.",
           rates:"Low. Tends to do well when inflation is rising.",
           risks:"Commodity price collapse, demand shocks, windfall taxes, the energy transition."},
  indu:   {name:"Industrials", kind:"Cyclical", what:"Aerospace and defence, machinery, transport, construction and trading houses.",
           drivers:"Business investment, manufacturing PMIs, infrastructure and defence budgets, freight volumes.",
           rates:"Moderate. Higher borrowing costs slow capital projects.",
           risks:"Manufacturing slowdown, supply-chain disruption, tariff and trade shocks."},
  discr:  {name:"Consumer Discretionary", kind:"Cyclical", what:"Autos, retailers, travel and leisure, homebuilders, e-commerce.",
           drivers:"Consumer confidence, real wage growth, credit availability, the housing market.",
           rates:"High. Big-ticket purchases are often financed.",
           risks:"Consumer slowdown, rising unemployment, tariffs on imported goods."},
  staples:{name:"Consumer Staples", kind:"Defensive", what:"Food, beverages, household and personal products, grocers.",
           drivers:"Steady demand, pricing power, input costs (grains, packaging, energy), emerging-market volumes.",
           rates:"Moderate. Often traded as a bond substitute for its stable dividends.",
           risks:"Input-cost inflation, private-label competition, weight-loss drug effects on food volumes."},
  util:   {name:"Utilities", kind:"Defensive / bond proxy", what:"Electric, gas and water utilities, power producers.",
           drivers:"Regulated returns, electricity demand (data centres), capital spending plans.",
           rates:"Very high. Rising yields make their dividends less attractive by comparison.",
           risks:"Rising bond yields, regulatory decisions, wildfire and weather liabilities."},
  mat:    {name:"Materials", kind:"Cyclical / commodity", what:"Chemicals, metals and mining, steel, construction materials, gold miners.",
           drivers:"Commodity prices, Chinese demand, the US dollar, global industrial production.",
           rates:"Low to moderate. A weaker dollar usually helps.",
           risks:"China slowdown, commodity oversupply, energy costs for European chemicals."},
  re:     {name:"Real Estate", kind:"Rate-sensitive income", what:"REITs and property companies: offices, warehouses, housing, data centres.",
           drivers:"Occupancy and rents, property valuations, financing costs.",
           rates:"Very high. Property values move inversely to long-term yields.",
           risks:"Refinancing walls, office vacancies, falling valuations."},
  comm:   {name:"Communication Services", kind:"Mixed growth / defensive", what:"Telecoms, media, and interactive platforms such as search and social.",
           drivers:"Digital ad spending, subscriber growth, content costs, 5G and fibre capex.",
           rates:"Moderate. Telecoms behave like bonds; platforms behave like tech.",
           risks:"Ad-market downturns, antitrust action, heavy network capex."},
  country:{name:"Country fund", kind:"Broad market", what:"A whole national stock market in one fund, all sectors blended.",
           drivers:"Domestic growth, central-bank policy, the currency, the sector mix of that market.",
           rates:"Depends on the market; returns are in US dollars, so currency moves count.",
           risks:"Political and policy risk, currency swings, concentration in a few large companies. See the Countries page for the full picture."},
};
const PHASE_COLORS = {"Early cycle":"var(--info)","Mid cycle":"var(--pos)","Late cycle":"var(--warn)","Contraction":"var(--neg)"};
const MACRO_HINT = {
  "^VIX":"Below 16 is calm, above 25 is stress. Spikes favour defensives.",
  "^TNX":"Rising yields weigh on tech, utilities and real estate.",
  "CURVE":"10Y minus 3M. Negative (inverted) has preceded most recessions.",
  "DX-Y.NYB":"A strong dollar hurts US multinationals, commodities and EM.",
  "CL=F":"Drives energy stocks; a cost for airlines and chemicals.",
  "GC=F":"Safe-haven demand and a hedge against falling real yields.",
  "HG=F":"'Dr Copper': an industrial-demand barometer.",
  "BTC-USD":"A gauge of speculative risk appetite.",
};
const COLS = [
  {k:"r1d",l:"1D",cap:.02},{k:"r1w",l:"1W",cap:.04},{k:"r1m",l:"1M",cap:.08},{k:"r3m",l:"3M",cap:.15},
  {k:"ytd",l:"YTD",cap:.3},{k:"r1y",l:"1Y",cap:.4},{k:"r3y",l:"3Y/yr",cap:.2},{k:"rs6m",l:"vs Mkt 6M",cap:.2},
];

/* ---------------------------------------------------------------- state */
const store = makeStore("sc.");
const S = {data:null, region:store.get("region","all"), q:"", sort:store.get("sort",{k:"score",dir:-1}),
           rrg:store.get("rrg","us"), sel:null, range:"1y"};
const groupName = id => (S.data.groups.find(g=>g.id===id)||{}).name||id;
const groupShort = id => ({us:"US",global:"Global",europe:"Europe",japan:"Japan",canada:"Canada",themes:"Theme",countries:"Country"})[id]||id;

/* ---------------------------------------------------------------- narrative */
function narrative(r){
  const m=r.m, b=S.data.benches[r.group], bn=b?b.name:"its market", out=[];
  if(m.r1y!=null){ const rel = m.rs1y; out.push(`${m.r1y>=0?"Up":"Down"} ${pct(Math.abs(m.r1y),1,false)} over 12 months`+
      (rel!=null?`, ${Math.abs(rel*100).toFixed(1)} pts ${rel>=0?"ahead of":"behind"} the ${bn}.`:".")); }
  out.push(m.trend===4?"Clean uptrend: above both its 50- and 200-day averages, and the 200-day is rising."
    : m.trend===0?"Clear downtrend: below both moving averages and the 200-day is falling."
    : m.vs200>0?`Mixed trend (${m.trend}/4 trend checks pass). Still above the 200-day average.`
    : `Mixed trend (${m.trend}/4 trend checks pass). Below the 200-day average, so the long-term trend is not yet repaired.`);
  const qx = {Leading:"Outperforming its market and relative momentum is still rising.",
    Weakening:"Still outperforming, but relative momentum is fading. Leaders often cool off from here.",
    Improving:"Still lagging, but relative momentum has turned up. An early turnaround candidate.",
    Lagging:"Underperforming its market with falling relative momentum."}[m.quad];
  if(qx) out.push("Rotation: "+qx);
  const ht=historyText(m); if(ht) out.push("Momentum of the rating: "+ht);
  const bf=(S.data.benches[r.group]||{}).facts||{};
  if(m.pe!=null&&bf.pe) out.push(`Valuation: P/E of ${m.pe.toFixed(1)} vs ${bf.pe.toFixed(1)} for the ${bn}, `+
    (m.peRel>0.25?`a ${pct(m.peRel,0,false)} premium. Investors are paying up for growth, so disappointments can hurt.`
     :m.peRel<-0.2?`a ${pct(-m.peRel,0,false)} discount. Cheap relative to the market, often for a reason, but it cushions bad news.`
     :"roughly in line with the market."));
  if(m.vol!=null) out.push(`Risk: ${pct(m.vol,0,false)} annualised volatility (3M), worst fall in the past year ${pct(m.mdd,1)}, now ${pct(m.offHigh,1)} from its 52-week high.`);
  if(m.rsi!=null){ if(m.rsi>=70) out.push(`Timing: RSI ${m.rsi.toFixed(0)} means it is short-term overbought. Chasing here carries pullback risk.`);
    else if(m.rsi<=30) out.push(`Timing: RSI ${m.rsi.toFixed(0)} means it is short-term oversold. Bounces are common, but confirm the trend first.`);
    else out.push(`Timing: RSI ${m.rsi.toFixed(0)}, neither overbought nor oversold.`); }
  const fav = S.data.cycle.favoured;
  if(r.key!=="country") out.push(fav.includes(r.key) ? `Cycle: historically favoured in a ${S.data.cycle.phase.toLowerCase()} backdrop, which is the current read.`
                                                    : `Cycle: not a typical winner in a ${S.data.cycle.phase.toLowerCase()} backdrop.`);
  return out;
}
function reasonShort(r){
  const m=r.m, bits=[];
  if(m.rsMom!=null) bits.push(`12-1M vs mkt ${pts(m.rsMom,0)}`);
  bits.push(`trend ${m.trend}/4`);
  if(m.quad) bits.push(m.quad.toLowerCase());
  if(m.d1w!=null&&Math.abs(m.d1w)>=1) bits.push(`score ${m.d1w>0?"+":""}${m.d1w.toFixed(0)} this week`);
  if(m.rsi>=70) bits.push("overbought"); if(m.rsi<=30) bits.push("oversold");
  return bits.join(" · ");
}

/* ---------------------------------------------------------------- render: page */
function filtered(){
  const q=S.q.trim().toLowerCase();
  return S.data.rows.filter(r=>(S.region==="all"||r.group===S.region) &&
    (!q || (r.name+" "+r.symbol+" "+r.fund+" "+groupName(r.group)+" "+(SECTORS[r.key]||{}).name).toLowerCase().includes(q) || holdingMatch(r)));
}
function sorted(rows){
  const {k,dir}=S.sort, get = r => k==="name"?r.name : k==="quad"?["Lagging","Improving","Weakening","Leading"].indexOf(r.m.quad) : r.m[k];
  return rows.slice().sort((a,b)=>{ const x=get(a), y=get(b); if(x==null) return 1; if(y==null) return -1;
    return (typeof x==="string"? x.localeCompare(y) : x-y)*dir; });
}

function render(){
  const D=S.data, app=$("#app");
  const cyc=D.cycle, fav=cyc.favoured;
  app.innerHTML = `
  <section>
    <div class="sec-head"><div class="grow"><div class="eyebrow">Market backdrop</div><h2>Where are we in the cycle?</h2>
      <p>A rules-based read of yields, commodities, volatility and the S&amp;P 500 trend. Different sectors tend to lead in different phases.</p></div></div>
    <div class="backdrop">
      <div class="card cycle">
        <div><div class="eyebrow">Current read</div><div class="phase" style="color:${PHASE_COLORS[cyc.primary]}">${esc(cyc.phase)}</div></div>
        <div class="phasebar">${Object.entries(cyc.weights).map(([k,v])=>`<i style="width:${v*100}%;background:${PHASE_COLORS[k]}" title="${esc(k)} ${Math.round(v*100)}%"></i>`).join("")}</div>
        <div class="phaselegend">${Object.entries(cyc.weights).map(([k,v])=>`<span><i class="sw" style="background:${PHASE_COLORS[k]}"></i>${esc(k)} <b>${Math.round(v*100)}%</b></span>`).join("")}</div>
        <ul>${cyc.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>
        <div><div class="eyebrow" style="margin-bottom:6px">Historically favoured now</div>
          <div class="chips">${fav.map(k=>`<span class="chip">${esc(SECTORS[k].name)}</span>`).join("")}</div></div>
      </div>
      <div class="macro">${macroTiles()}</div>
    </div>
  </section>

  <section>
    <div class="sec-head"><div class="grow"><div class="eyebrow">Shortlist</div><h2>What the data favours today</h2>
      <p>Pulled from all ${D.rows.length} funds. Scores rank each fund against every other on momentum, trend, relative strength and risk (0 = weakest, 100 = strongest). Read the <a href="#limits">limitations</a> before acting on it.</p>
      ${btSummaryLine(D.backtest,"sectors")}</div></div>
    <div class="ideas">${ideas()}</div>
  </section>

  <section class="two">
    <div class="card panel rrgbox">
      <div class="sec-head"><div class="grow"><div class="eyebrow">Rotation map</div><h3>Who is gaining leadership?</h3>
        <p style="font-size:13px">Right = beating the market. Up = that lead is growing. Sectors usually rotate clockwise: Improving → Leading → Weakening → Lagging. Tails show the last 6 weeks.</p></div>
        <select id="rrgsel" class="btn" aria-label="Region for rotation map">${D.groups.map(g=>`<option value="${g.id}" ${S.rrg===g.id?"selected":""}>${esc(g.name)}</option>`).join("")}</select></div>
      <div id="rrg"></div>
    </div>
    <div class="card panel">
      <div class="sec-head"><div class="grow"><div class="eyebrow">Across regions</div><h3>Same sector, different market</h3>
        <p style="font-size:13px">Average score of each sector in each region. Use it to pick where to own a sector, not just which one. Click a cell to open it.</p></div></div>
      <div style="overflow-x:auto">${matrix()}</div>
    </div>
  </section>

  <section id="ranking">
    <div class="sec-head"><div class="grow"><div class="eyebrow">Full ranking</div><h2>Every sector, scored</h2>
      <p>Click any row for the full breakdown, chart and reasoning. Click a column header to sort. Returns are total return in local currency.</p></div>
      <div class="controls">
        <div class="tabs" role="group" aria-label="Region">${[["all","All"],...D.groups.map(g=>[g.id,groupShort(g.id)])].map(([id,l])=>
          `<button class="tab" type="button" data-region="${id}" aria-pressed="${S.region===id}">${esc(l==="Theme"?"Themes":l==="Country"?"Countries":l)}</button>`).join("")}</div>
        <input class="search" id="search" type="search" placeholder="Search sector, ticker or holding (e.g. Nvidia)" value="${esc(S.q)}" aria-label="Search">
      </div></div>
    <div class="tablebox" id="tablebox"></div>
    <div class="legend-row">
      <span><b>Δ 1W</b> change in score over the past week</span>
      <span><b>Trend</b> 4 bars: above 50-day avg · above 200-day avg · 50-day above 200-day · 200-day rising</span>
      <span><b>vs Mkt 6M</b> 6-month return minus its local benchmark</span>
      <span><b>Rotation</b> <span class="q q-Leading">Leading</span> · <span class="q q-Weakening">Weakening</span> · <span class="q q-Lagging">Lagging</span> · <span class="q q-Improving">Improving</span></span>
      <span><b class="fit">✓</b> suits the current cycle phase</span>
    </div>
  </section>

  ${backtestSection(D.backtest,{noun:"sectors",benchWord:"their own market"})}

  <section>
    <div class="sec-head"><div class="grow"><div class="eyebrow">Method</div><h2>How to use this</h2></div></div>
    <div class="method">
      <div class="card"><h3>The score</h3><p>Every fund is ranked against all others on six measures, then blended:</p>
        <ul>${Object.entries(D.weights).map(([k,w])=>`<li>${esc(partName(k))}: ${Math.round(w*100)}%</li>`).join("")}</ul>
        <p>Measuring against each region's own benchmark keeps currency and market moves out of the comparison.</p></div>
      <div class="card"><h3>Reading the signals</h3><ul>
        <li><b>Strong overweight / Overweight</b> (60+): momentum and trend are on its side.</li>
        <li><b>Neutral</b> (40–60): no clear edge.</li>
        <li><b>Underweight / Avoid</b> (&lt;40): lagging with a weak trend.</li>
        <li><b>Δ 1W</b> shows whether a rating is improving or fading. A rising score often leads a signal change.</li>
        <li><b>Improving</b> on the rotation map flags early turnarounds before the score catches up.</li>
        <li><b>Overbought</b> flags suggest waiting for a dip, even for strong sectors.</li></ul></div>
      <div class="card"><h3>What updates, and when</h3>
        <p><b>With every price update</b> (${STATIC?"about every 15–30 minutes":"every 5 minutes"}): returns, trend, RSI, volatility, every score and signal, score changes and history, flags, the rotation map, the cycle read, the shortlists and every written verdict. Scores use the latest trade price. Open pages pick up new data by themselves.</p>
        <p><b>Once a month:</b> the backtest gains a new month when one completes.</p>
        <p><b>Once a day:</b> top-10 holdings, net assets, P/E, yield, beta and fees.</p>
        <p><b>Fixed:</b> the sector descriptions and the cycle-to-sector mapping.</p>
        <p class="muted" style="font-size:12.5px">${D.rows.length} funds · built in ${D.buildSeconds}s${D.errors.length?` · unavailable: ${esc(D.errors.join(", "))}`:""}</p></div>
    </div>
  </section>

  <section id="limits">
    <div class="sec-head"><div class="grow"><div class="eyebrow">Read before relying on it</div><h2>Limitations</h2>
      <p>This is a screening tool that summarises price behaviour. It is not a forecast, and it should be one input among several.</p></div></div>
    <div class="method">
      <div class="card"><h3>The data</h3><ul>
        <li>Prices come from Yahoo Finance's free, unofficial feed. Exchange data can be ~15 minutes delayed, and the feed can have gaps, errors or stop working without notice.</li>
        <li>Yahoo's history occasionally contains bad prints (for example, TOPIX at a tenth of its value for two days in March 2026). Short glitches that snap back are filtered out; longer ones could still slip through.</li>
        <li>The website depends on GitHub's scheduler, which can run late. The status line at the top turns amber ("Delayed") if data is more than an hour old.</li>
        <li>Each region only moves while its market is open, so Japan, Europe and North America update at different times of day.</li>
        <li>Fund facts (P/E, yield, beta, fees, net assets) are Yahoo's figures and can lag or differ from the fund provider's own. Yahoo has no expense ratio for the Japanese TOPIX-17 funds.</li>
        <li>Holdings are as of the provider's last disclosure, which can be weeks old.</li></ul></div>
      <div class="card"><h3>The analysis</h3><ul>
        <li>Scores are built only from past prices. They don't see earnings, valuations, news, policy or events that haven't hit prices yet.</li>
        <li>Momentum tends to persist over 3–12 months on average, but it reverses sharply at turning points, which is exactly when it hurts most.</li>
        <li>${D.backtest?`The backtest found ${esc(btStrength(D.backtest).word)} for this score, and it covers funds chosen with hindsight.`:"The score has not been backtested yet."} See <a href="#track">the track record</a>.</li>
        <li>Scores are ranks against the other funds here, so a fund's score can change because other funds moved.</li>
        <li>The cycle read uses a handful of US-centred indicators and simple rules. Which sectors "suit" each phase is a historical tendency, not a rule.</li>
        <li>The rotation map is an approximation of the Relative Rotation Graph method, not the licensed original.</li></ul></div>
      <div class="card"><h3>Investing with it</h3><ul>
        <li>Returns are in each fund's local currency and include dividends. They exclude trading costs, spreads, taxes and currency moves for your home currency.</li>
        <li>Some funds (European UCITS, Japanese and Canadian listings) may not be available to you, may be taxed differently, or trade thinly with wide spreads.</li>
        <li>Net assets are converted to US dollars at today's exchange rate.</li>
        <li>The fund list is hand-picked and doesn't cover every sector, market or share class.</li>
        <li>Past performance does not guarantee future returns.</li></ul></div>
    </div>
    <p class="disclaimer">For research and education only. This is not personalised investment advice. Check a fund's costs, holdings, risks and suitability for you before investing, and consider speaking to a licensed adviser.</p>
  </section>`;

  renderTable(); renderRRG(); drawBacktest(D.backtest);
  app.querySelectorAll("[data-region]").forEach(b=>b.onclick=()=>{S.region=b.dataset.region;store.set("region",S.region);
    app.querySelectorAll("[data-region]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.region===S.region));renderTable();});
  $("#search").oninput=e=>{S.q=e.target.value;renderTable();};
  $("#rrgsel").onchange=e=>{S.rrg=e.target.value;store.set("rrg",S.rrg);renderRRG();};
  app.querySelectorAll(".ideas [data-open], .matrix [data-open]").forEach(el=>el.onclick=()=>openDetail(el.dataset.open));
}

function macroTiles(){
  const M=S.data.macro, order=["^VIX","^TNX","CURVE","DX-Y.NYB","CL=F","GC=F","HG=F","BTC-USD"];
  return order.map(sym=>{
    if(sym==="CURVE"){ const a=M["^TNX"], b=M["^IRX"]; if(!a||!b) return "";
      const v=a.price-b.price; return `<div class="tile"><span class="lab">Yield curve</span><span class="val ${v<0?"neg":""}">${v>0?"+":""}${v.toFixed(2)}<small style="font-size:12px"> pts</small></span>
        <span class="chg"><span class="muted">3M bill ${b.price.toFixed(2)}%</span></span><span class="hint">${MACRO_HINT.CURVE}</span></div>`; }
    const m=M[sym]; if(!m) return "";
    const isY = sym==="^TNX", val = isY? m.price.toFixed(2)+"%" : money(m.price);
    const up = sym==="^VIX"||sym==="^TNX" ? "var(--warn)" : null;
    return `<div class="tile"><span class="lab">${esc(m.label)}</span><span class="val">${val}</span>
      <span class="chg"><span class="${cls(m.r1d)}">1D ${pct(m.r1d)}</span><span class="${cls(m.r3m)}">3M ${pct(m.r3m)}</span></span>
      ${sparkSVG(m.spark,{w:200,h:30,color:up})}<span class="hint">${esc(MACRO_HINT[sym]||"")}</span></div>`;
  }).join("");
}

function ideaRow(r){
  return `<div class="idea" data-open="${esc(r.symbol)}" role="button" tabindex="0">
    <span class="nm">${esc(r.name)} <span class="muted" style="font-weight:400;font-size:13px">${esc(groupShort(r.group))} · ${esc(r.symbol)}</span></span>
    <span class="sc"><span class="pill ${sigClass(r.m.signal)}">${Math.round(r.m.score)}</span></span>
    <span class="sub">${esc(reasonShort(r))} · 1Y ${pct(r.m.r1y,0)}</span></div>`;
}
function ideas(){
  const rows=S.data.rows.filter(r=>r.m.score!=null);
  const lead = rows.slice().sort((a,b)=>b.m.score-a.m.score).slice(0,6);
  const turn = rows.filter(r=>r.m.quad==="Improving" && r.m.rrg && r.m.rrg.length>1)
    .map(r=>({r,mom:r.m.rrg[r.m.rrg.length-1][1]-r.m.rrg[0][1]+(r.m.trend*0.5)+((r.m.d1m||0)/10)}))
    .sort((a,b)=>b.mom-a.mom).slice(0,6).map(x=>x.r);
  const avoid = rows.slice().sort((a,b)=>a.m.score-b.m.score).slice(0,6);
  const col=(title,color,desc,list)=>`<div class="card idea-col"><h3><i class="sw" style="background:${color}"></i>${title}</h3><p>${desc}</p>${list.map(ideaRow).join("")||'<p class="muted">Nothing qualifies right now.</p>'}</div>`;
  return col("Leaders to own","var(--pos)","Highest scores: strong trend and outperformance.",lead)+
         col("Turnaround watch","var(--info)","Lagging but relative momentum has turned up. Wait for trend confirmation.",turn)+
         col("Weakest: avoid for now","var(--neg)","Lowest scores: persistent underperformance and weak trend.",avoid);
}

function renderTable(){
  const rows=sorted(filtered()), fav=S.data.cycle.favoured;
  const th=(k,l,c="",title="")=>`<th class="${c}" data-k="${k}" ${S.sort.k===k?`data-dir="${S.sort.dir>0?"▲":"▼"}"`:""} title="${esc(title)}">${l}</th>`;
  $("#tablebox").innerHTML = rows.length? `<table><thead><tr>
    <th class="l" style="cursor:default">#</th>${th("name","Sector","l sticky")}${th("score","Score &amp; signal","l","Composite 0–100")}${th("d1w","Δ 1W","","Change in score over the past week")}
    ${COLS.map(c=>th(c.k,c.l,"",c.k==="rs6m"?"6M return minus local benchmark":"")).join("")}
    ${th("trend","Trend","","Trend checks passed, out of 4")}${th("rsi","RSI","","14-day RSI: >70 overbought, <30 oversold")}
    ${th("vol","Vol","","Annualised volatility, last 3 months")}${th("offHigh","From high","","Distance from 52-week high")}
    ${th("aum","Net assets","","Fund size, converted to US dollars")}${th("pe","P/E","","Trailing price/earnings of the holdings. Lower = cheaper")}
    ${th("yld","Yield","","Dividend yield over the last 12 months")}${th("beta","Beta","","Beta (5Y monthly): 1 = moves with the market, above 1 = swings more")}
    ${th("fee","Fee","","Annual expense ratio")}
    ${th("quad","Rotation","l")}${th("top10","Top holdings","l","Largest three holdings; % = weight of the top 10 combined")}<th class="l" style="cursor:default">Flags</th><th style="cursor:default" title="Favoured in the current cycle phase">Cycle</th><th style="cursor:default">1Y</th>
  </tr></thead><tbody>${rows.map((r,i)=>{const m=r.m; return `<tr data-open="${esc(r.symbol)}">
    <td class="rank l">${i+1}</td>
    <td class="l sticky"><div class="nmcell"><b>${esc(r.name)}</b><small>${esc(r.symbol)} · ${esc(groupShort(r.group))}</small></div></td>
    <td class="l"><div class="scorecell"><span class="num" style="width:26px;text-align:right">${m.score==null?"–":Math.round(m.score)}</span>
      <span class="bar"><i style="width:${m.score||0}%;background:${scoreColor(m.score)}"></i></span><span class="pill ${sigClass(m.signal)}">${esc(m.signal||"–")}</span></div></td>
    <td>${delta(m.d1w,`Today ${m.d1??"–"} · 1 month ${m.d1m??"–"}`)}</td>
    ${COLS.map(c=>`<td class="n" style="${heat(m[c.k],c.cap)}">${pct(m[c.k])}</td>`).join("")}
    <td>${trendBars(m.trend)}</td>
    <td class="n" style="${m.rsi>=70?"color:var(--warn)":m.rsi<=30?"color:var(--info)":""}">${m.rsi==null?"–":m.rsi.toFixed(0)}</td>
    <td class="n">${pct(m.vol,0,false)}</td><td class="n">${pct(m.offHigh,1)}</td>
    <td class="n">${bigMoney(m.aum,"USD")}</td>
    <td class="n" title="${m.peRel==null?"":esc(pct(m.peRel,0)+" vs its market")}" style="${m.peRel==null?"":m.peRel>0.25?"color:var(--warn)":m.peRel<-0.2?"color:var(--info)":""}">${m.pe==null?"–":m.pe.toFixed(1)}</td>
    <td class="n">${pct(m.yld,1,false)}</td><td class="n">${m.beta==null?"–":m.beta.toFixed(2)}</td><td class="n">${pct(m.fee,2,false)}</td>
    <td class="l"><span class="q q-${m.quad}">${esc(m.quad||"–")}</span></td>
    <td class="l">${topCell(r)}</td>
    <td class="l">${flagsHTML(m)}</td>
    <td>${r.key!=="country"&&fav.includes(r.key)?'<span class="fit" title="Favoured in the current cycle phase">✓</span>':""}</td>
    <td>${sparkSVG(m.series.c.filter((_,j)=>j%3===0||j===m.series.c.length-1))}</td></tr>`;}).join("")}</tbody></table>`
    : `<p class="loading">No sectors match “${esc(S.q)}”.</p>`;
  $("#tablebox").querySelectorAll("th[data-k]").forEach(h=>h.onclick=()=>{const k=h.dataset.k;
    S.sort = S.sort.k===k? {k,dir:-S.sort.dir} : {k,dir:k==="name"?1:-1}; store.set("sort",S.sort); renderTable();});
  $("#tablebox").querySelectorAll("tr[data-open]").forEach(tr=>tr.onclick=()=>openDetail(tr.dataset.open));
}

function topCell(r){
  const h=r.holdings; if(!h||!h.length) return '<span class="muted">–</span>';
  const hit=holdingMatch(r);
  if(hit) return `<span class="tops"><mark>${esc(hit.name)} ${pct(hit.pct,1,false)}</mark></span>`;
  const short=s=>s.replace(/ (Inc|Corp|Corporation|Co|Ltd|Plc|PLC|AG|SA|SE|NV|ASA|Holdings?|Group|Class [A-C]|Company|Incorporated)\.?$/i,"").replace(/ (Inc|Corp|Co|Ltd|Plc)\.?$/i,"");
  return `<span class="tops" title="${esc(h.map(x=>x.name+" "+pct(x.pct,1,false)).join("\n"))}">${esc(h.slice(0,3).map(x=>short(x.name)).join(", "))}<small>${pct(r.m.top10,0,false)} in top 10</small></span>`;
}
function renderRRG(){
  rrgChart($("#rrg"), S.data.rows.filter(r=>r.group===S.rrg&&r.m.rrg&&r.m.rrg.length)
    .map(r=>({key:r.symbol,label:r.name,rrg:r.m.rrg,quad:r.m.quad})), openDetail);
}

function matrix(){
  const regs=["us","global","europe","japan","canada","themes"], keys=Object.keys(SECTORS).filter(k=>k!=="country");
  const fav=S.data.cycle.favoured;
  const cell=(k,g)=>{ const rs=S.data.rows.filter(r=>r.key===k&&r.group===g&&r.m.score!=null);
    if(!rs.length) return `<td class="cell empty">·</td>`;
    const avg=rs.reduce((a,r)=>a+r.m.score,0)/rs.length, best=rs.slice().sort((a,b)=>b.m.score-a.m.score)[0];
    const t=(avg-50)/50, bg=`color-mix(in oklab,var(${t>0?"--pos":"--neg"}) ${Math.round(Math.abs(t)*55)}%,transparent)`;
    return `<td class="cell" style="background:${bg}" data-open="${esc(best.symbol)}" title="${esc(rs.map(r=>r.name+" "+Math.round(r.m.score)).join(", "))}">${Math.round(avg)}</td>`; };
  return `<table class="matrix"><thead><tr><th class="l"></th>${regs.map(g=>`<th>${esc(groupShort(g))}</th>`).join("")}</tr></thead>
    <tbody>${keys.map(k=>`<tr><td class="l">${esc(SECTORS[k].name)}${fav.includes(k)?' <span class="fit" title="Favoured in the current cycle phase">✓</span>':""}</td>${regs.map(g=>cell(k,g)).join("")}</tr>`).join("")}</tbody></table>`;
}

/* ---------------------------------------------------------------- detail drawer */
function openDetail(sym){
  const r=S.data.rows.find(x=>x.symbol===sym); if(!r) return; S.sel=sym;
  const m=r.m, sec=SECTORS[r.key]||SECTORS.country, b=S.data.benches[r.group];
  const peers=S.data.rows.filter(x=>x.key===r.key&&x.symbol!==sym&&r.key!=="country").sort((a,b)=>b.m.score-a.m.score).slice(0,8);
  const rangeBtn=(k,l)=>`<button type="button" data-range="${k}" aria-pressed="${S.range===k}">${l}</button>`;
  const d=Drawer.open(r.name,`
    <div class="hd"><div><div class="eyebrow">${esc(groupName(r.group))} · ${esc(r.symbol)} · ${esc(sec.name)}</div><h2>${esc(r.name)}</h2>
      <div class="muted" style="font-size:13px">${esc(r.fund)}</div>
      <div style="margin-top:6px"><span class="num" style="font-size:18px">${money(m.price,r.ccy)}</span>
      <span class="num ${cls(m.r1d)}" style="margin-left:8px">${pct(m.r1d,2)} today</span></div></div>
      <button class="btn close" type="button" id="closeD" aria-label="Close">Close ✕</button></div>
    <div class="dgrid">
      <div class="card verdict"><div class="bigscore" style="color:${scoreColor(m.score)}">${m.score==null?"–":Math.round(m.score)}<small>/100</small></div>
        <div><span class="pill ${sigClass(m.signal)}">${esc(m.signal)}</span> <span class="q q-${m.quad}" style="margin-left:6px">${esc(m.quad||"")}</span>
          ${flagsHTML(m)}
          <p style="margin:8px 0 0;font-size:15px">${esc(verdict(m))}</p>${automatedNote(S.data.generated)}</div></div>
      <div class="card" style="padding:16px"><div class="eyebrow" style="margin-bottom:8px">What drives the score (percentile vs all ${S.data.rows.length} funds)</div>
        <div class="parts">${Object.entries(m.parts).map(([k,v])=>`<span>${esc(partName(k))}</span><span class="bar"><i style="width:${v??0}%;background:${scoreColor(v??50)}"></i></span><span class="num">${v??"–"}</span>`).join("")}</div></div>
      ${scoreHistoryCard()}
      <div class="card chartbox"><div class="row"><span class="eyebrow">Price</span>
        <span class="key"><i style="background:var(--ink)"></i>Price</span><span class="key"><i style="background:var(--accent)"></i>50-day</span><span class="key"><i style="background:var(--warn)"></i>200-day</span>
        <span class="seg" role="group" aria-label="Range">${rangeBtn("1y","1Y")}${rangeBtn("5y","5Y")}${rangeBtn("10y","10Y")}</span></div>
        <div id="pchart"></div></div>
      ${m.relSeries?`<div class="card chartbox"><div class="row"><span class="eyebrow">Relative to ${esc(b?b.name:"market")}</span>
        <span class="muted" style="font-size:12.5px">Rising line = beating the market. Rebased to 100 a year ago.</span></div><div id="rchart"></div></div>`:""}
      <div class="stats">${[["1 month",pct(m.r1m),m.r1m],["3 months",pct(m.r3m),m.r3m],["Year to date",pct(m.ytd),m.ytd],["1 year",pct(m.r1y),m.r1y],
        ["3 years (per yr)",pct(m.r3y),m.r3y],["5 years (per yr)",pct(m.r5y),m.r5y],["vs market 1Y",pts(m.rs1y),m.rs1y],["vs 200-day avg",pct(m.vs200),m.vs200],
        ["RSI (14d)",m.rsi==null?"–":m.rsi.toFixed(0),null],["Volatility (3M)",pct(m.vol,0,false),null],["Sharpe (1Y)",m.sharpe==null?"–":m.sharpe.toFixed(2),m.sharpe],["Max drawdown 1Y",pct(m.mdd),m.mdd]]
        .map(([l,v,c])=>`<div><span>${l}</span><b class="${c==null?"":cls(c)}">${v}</b></div>`).join("")}</div>
      ${factsCard(r.facts||{},{ccy:r.ccy,bf:(b||{}).facts||{},bn:b?b.name:"its market",note:"From Yahoo Finance, checked daily. Fund size is converted to US dollars at today's exchange rate."})}
      ${holdingsCard(r,S.data.holdingsAt)}
      <div class="card" style="padding:16px"><div class="eyebrow" style="margin-bottom:8px">The reasoning</div><ul class="why">${narrative(r).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
      <dl class="card primer"><dt>What it is</dt><dd>${esc(sec.what)}</dd><dt>Type</dt><dd>${esc(sec.kind)}</dd><dt>Key drivers</dt><dd>${esc(sec.drivers)}</dd>
        <dt>Rate sensitivity</dt><dd>${esc(sec.rates)}</dd><dt>Main risks</dt><dd>${esc(sec.risks)}</dd></dl>
      ${peers.length?`<div class="card" style="padding:16px"><div class="eyebrow" style="margin-bottom:4px">${esc(sec.name)} elsewhere</div>
        ${peers.map(p=>`<div class="idea" data-open="${esc(p.symbol)}" role="button" tabindex="0"><span class="nm">${esc(p.name)} <span class="muted" style="font-weight:400;font-size:13px">${esc(groupShort(p.group))} · ${esc(p.symbol)}</span></span>
          <span class="sc"><span class="pill ${sigClass(p.m.signal)}">${Math.round(p.m.score)}</span></span></div>`).join("")}</div>`:""}
    </div>`,()=>{S.sel=null;});
  d.querySelectorAll("[data-range]").forEach(bt=>bt.onclick=()=>{S.range=bt.dataset.range;d.querySelectorAll("[data-range]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.range===S.range));drawPrice(r);});
  d.querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>openDetail(el.dataset.open));
  drawCharts(r);
}
function drawCharts(r){
  const m=r.m; drawPrice(r); drawScoreHistory(m,S.data.histCuts);
  if(m.relSeries) lineChart($("#rchart"),{t:m.series.t.slice(-m.relSeries.length),series:[{v:m.relSeries,color:"var(--accent)",name:"Relative"}],h:170,baseline:100,fmt:v=>v.toFixed(1)});
}
function holdingMatch(r){
  const q=S.q.trim().toLowerCase(); if(!q||!r.holdings) return null;
  return r.holdings.find(x=>x.name.toLowerCase().includes(q)||x.sym.toLowerCase()===q) || null;
}
function drawPrice(r){
  const m=r.m, dp=m.price>=100?0:2;
  if(S.range==="1y") return lineChart($("#pchart"),{t:m.series.t,series:[{v:m.series.c,color:"var(--ink)",name:"Price",w:1.8},{v:m.ma50,color:"var(--accent)",name:"50d",w:1.2},{v:m.ma200,color:"var(--warn)",name:"200d",w:1.2}],fmt:v=>v.toFixed(dp),area:1});
  const n=S.range==="5y"?252:m.long.t.length;
  lineChart($("#pchart"),{t:m.long.t.slice(-n),series:[{v:m.long.c.slice(-n),color:"var(--ink)",name:"Price",w:1.6}],fmt:v=>v.toFixed(dp),area:1});
}

/* ---------------------------------------------------------------- data loop */
startLoop({url:"data", onData(data){
  const reopen=S.sel, scrollY=window.scrollY;
  data.rows.forEach(r=>{ r.m.top10 = r.holdings&&r.holdings.length ? r.holdings.reduce((a,x)=>a+x.pct,0) : null;
    const f=r.facts||{}, bf=(data.benches[r.group]||{}).facts||{};
    Object.assign(r.m,{aum:f.aumUsd??null, pe:f.pe??null, yld:f.yld??null, beta:f.beta??null, fee:f.fee??null,
      peRel: f.pe&&bf.pe ? f.pe/bf.pe-1 : null}); });
  S.data=data; render(); window.scrollTo(0,scrollY);
  if(reopen) openDetail(reopen);
}});
let rt; addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{ if(!S.data) return; renderRRG(); drawBacktest(S.data.backtest);
  const r=S.sel&&S.data.rows.find(x=>x.symbol===S.sel); if(r) drawCharts(r); },200);});
</script>
</body>
</html>
